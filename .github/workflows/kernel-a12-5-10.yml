name: 内核构建 - Android 12 (5.10)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
          - FinaSU
          - Official
          - Next
        default: BakaSU
      enable_susfs:
        description: "集成 SUSFS"
        required: false
        type: boolean
        default: true
      use_kpm:
        description: "KPM 模块支持（编译后修补 Image。6.12 及以上不支持：SukiSU 的 KPM 代码用了新内核已移除的 netlink_kernel_cfg.cb_mutex；6.6 也不修补 Image，实际可用范围是 SukiSU 系 + 内核 ≤ 6.1；且仅 SukiSU 系提供 KPM）"
        required: true
        type: choice
        default: "patched (开启并修补)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补)"
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "不启用"
          - "678"
          - "123"
          - "345"
        default: "不启用"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

      # ==================== 文本输入 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Thu Sep 17 00:00:00 UTC 2026"

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: true
      use_bbg:
        description: "启用 BBG 基带保护（防止基带分区被擦除）"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_net_enhance:
        description: "启用网络增强（IPSet + BBR + FQ 队列 + IPv6 NAT + 附加拥塞算法）"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "可选功能不兼容或失败时自动跳过，而非中断构建（SUSFS 与一加 8E 除外）"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 NTSync 支持（需先启用 Droidspaces）"
        required: false
        type: boolean
        default: false
      send_telegram:
        description: "发送 Telegram 通知（需配置 secrets）"
        required: false
        type: boolean
        default: true
      use_release_cache:
        description: "用 GitHub Release 存储 ccache"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持（非一加勿开）"
        required: false
        type: boolean
        default: false
      ksu_branch_mode:
        description: "SukiSU 拉取分支：auto=跟随SUSFS开关自动选 / main=纯管理器分支 / builtin=内核内置实现（仅 SukiSU 生效）"
        required: false
        type: choice
        options:
          - "auto"
          - "main"
          - "builtin"
        default: "auto"
      manager_commit:
        description: "提交 hash（合并输入框）：<管理器&内核KSU>,<SUSFS>，逗号或竖线分隔均可，0 = 该段不指定。例：0,def456...(只锁 SUSFS) / abc123...,0(只锁管理器与内核)；留空则不锁定。FinaSU 始终对齐官方 Release"
        required: false
        type: string
        default: ""
      # ksu_mode 已从手动触发界面隐藏：本仓库的存在前提就是集成 KernelSU，
      # 不存在"不集成 KSU"的常规用法。功能代码未删除——build.yml 的
      # workflow_call 仍保留该输入，需要时取消下面注释并恢复 with: 透传即可。
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Thu Sep 17 00:00:00 UTC 2026"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_net_enhance:
        description: "启用网络增强（IPSet + BBR + FQ 队列 + IPv6 NAT + 附加拥塞算法）"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "可选功能不兼容或失败时自动跳过，而非中断构建（SUSFS 与一加 8E 除外）"
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      enable_susfs:
        description: "集成 SUSFS"
        required: false
        type: boolean
        default: true
      droidspaces:
        required: false
        type: string
        default: "不启用"
      artifact_upload_mode:
        required: false
        type: string
        default: "上传全部"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        description: "导出 SUSFS 集成补丁（由 main.yml 传入）"
        required: false
        type: boolean
        default: false

      send_telegram:
        description: "发送 Telegram 通知（需配置 secrets）"
        required: false
        type: boolean
        default: true
      use_release_cache:
        description: "用 GitHub Release 存储 ccache"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持（非一加勿开）"
        required: false
        type: boolean
        default: false
      ksu_branch_mode:
        description: "SukiSU 拉取分支：auto=跟随SUSFS开关自动选 / main=纯管理器分支 / builtin=内核内置实现（仅 SukiSU 生效）"
        required: false
        type: string
        default: "auto"
      manager_commit:
        description: "提交 hash（合并输入框）：<管理器&内核KSU>,<SUSFS>，逗号或竖线分隔均可，0 = 该段不指定。例：0,def456...(只锁 SUSFS) / abc123...,0(只锁管理器与内核)；留空则不锁定。FinaSU 始终对齐官方 Release"
        required: false
        type: string
        default: ""
      ksu_commit:
        description: "对齐用：内核 KernelSU 检出到该提交（所选 Manager 构建同一提交；留空跟随 main HEAD）"
        required: false
        type: string
        default: ""
      ksu_cert_size:
        required: false
        type: string
        default: ""
      ksu_cert_hash:
        required: false
        type: string
        default: ""
      ksu_mode:
        description: "KernelSU 模式：关闭=正常集成 KernelSU / 禁用KSU=不集成任何 KernelSU 代码（SUSFS 的启停由 enable_susfs 独立控制，不要写在这里）"
        required: false
        type: string
        default: "关闭"
jobs:
  prepare-matrix:
    name: "生成构建矩阵"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      # 自动更新（由 main.yml 调用）只编裁剪矩阵；手动触发编全量矩阵。
      # 两者数据都来自 .github/workflows/config/matrix.json。
      - name: 生成构建矩阵
        id: gen
        env:
          MODE: ${{ inputs.called_from_main && 'auto' || 'full' }}
        run: python3 scripts/gen_matrix.py --mode "$MODE" --android android12 --github-output

  build-kernels-a12-5-10:
    needs: [prepare-matrix, get-ksu-manager]
    # 管理器拉取失败/被跳过时不阻塞内核构建（ksuCommit 为空则内核跟随 main HEAD）
    # 空矩阵时也必须跳过：matrix.include=[] 会起 0 个作业、job 结果为 skipped，
    # 若照跑，main.yml 的发布校验会因为「skipped」误判为通过而产出空 Release。
    # 与 kernel-a16-6-12.yml 的条件保持一致（两个条件必须写在同一条 if 里）。
    if: ${{ !cancelled() && needs.prepare-matrix.result == 'success' && needs.prepare-matrix.outputs.count != '0' }}
    name: "5.10.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        # 矩阵改由 .github/workflows/config/matrix.json 生成（19 组合）
        # 本轮维护范围：仅保留仍在实机使用的子版本，剔除早期已弃用版本
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      revision: ${{ matrix.revision }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      # 内核对齐：KernelSU 检出到所选 Manager 构建同一提交（BakaSU / FinaSU 生效）
      ksu_commit: ${{ inputs.ksu_commit || needs.get-ksu-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ inputs.ksu_cert_size || needs.get-ksu-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ inputs.ksu_cert_hash || needs.get-ksu-manager.outputs.managerCertHash }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_net_enhance: ${{ inputs.use_net_enhance || false }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches || false }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.enable_susfs }}
      # ksu_mode 不传：build.yml 默认「关闭」（正常集成 KernelSU）。
      droidspaces: ${{ inputs.droidspaces || '不启用' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      send_telegram: ${{ inputs.send_telegram || false }}
      use_release_cache: ${{ inputs.use_release_cache || false }}
      manager_commit: ${{ inputs.manager_commit }}
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}
  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      manager_spoofed: true
      manager_commit: ${{ inputs.manager_commit }}
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}
