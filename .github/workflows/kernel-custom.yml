name: Android 内核构建-自定义

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "5.10"
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
          - Official
          - Next
        default: BakaSU
      enable_susfs:
        description: "集成 SUSFS"
        required: false
        type: boolean
        default: true
      use_kpm:
        description: "KPM 模块支持（编译后修补 Image。6.12 及以上不支持：SukiSU 的 KPM 代码用了新内核已移除的 netlink_kernel_cfg.cb_mutex；6.6 是支持的）"
        required: true
        type: choice
        default: "patched (开启并修补)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补)"
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "不启用"
          - "678"
          - "123"
          - "345"
        default: "不启用"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

      # ==================== 文本输入 ====================
      build_scope:
        description: "构建范围（选「全部版本」或「仅 LTS」时，下面的「构建目标」不生效）"
        required: true
        type: choice
        options:
          - 指定版本
          - 全部版本
          - 仅 LTS
        default: 指定版本
      os_patch_level:
        description: "构建目标：可填子版本代号（如 66、236）或补丁级别日期（如 2022-01），也可用逗号分隔多个（如 66,236,2022-01）。默认只构建一个版本。"
        required: true
        type: string
        default: "66"
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Thu Sep 17 00:00:00 UTC 2026"

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: true
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持（非一加勿开）"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 NTSync 支持（需先启用 Droidspaces）"
        required: false
        type: boolean
        default: false

      # 网络增强（IPSet 全类型 + BBR + FQ/FQ_CODEL 队列 + IPv6 NAT + 附加拥塞算法）。
      # 本项已包含「把 BBR 设为默认拥塞算法」，所以这里不再单列 use_bbr 开关：
      # 网络增强关着却想单独要 BBR 的场景不存在，两个开关只会造成歧义。
      # 需要单独控制 BBR 请改用单版本入口 kernel-a1*.yml（那里两者是分开的）。
      use_net_enhance:
        description: "网络优化（BBR 默认拥塞算法 + IPSet 全类型 + FQ/FQ_CODEL 队列 + IPv6 NAT + 附加拥塞算法内建）"
        required: false
        type: boolean
        default: false
      send_telegram:
        description: "发送 Telegram 通知（需配置 secrets）"
        required: false
        type: boolean
        default: true
      use_release_cache:
        description: "用 GitHub Release 存储 ccache"
        required: false
        type: boolean
        default: false
      manager_commit:
        description: "管理器提交 hash（SukiSU/管理器 hash；可选用英文逗号后接 SUSFS hash，留空则不锁定）。注意：它只决定选用哪个管理器 APK，不直接控制内核源码——内核跟随所选 APK 对应的构建提交，且落后超过 5 个提交时会放弃对齐。要精确钉住内核版本请用下面的「内核 KSU 对齐提交」"
        required: false
        type: string
        default: ""
      ksu_commit:
        description: "内核 KSU 对齐提交：内核侧 KernelSU 直接检出到该提交（留空=沿用自动对齐/跟随上游 main HEAD）。上游临时故障时的止损手段，例如 BakaSU 挂起 SUSFS 期间可填 5b76b884c75f729a220bb317aa4a4fc78f0e0e9c"
        required: false
        type: string
        default: ""
      # ksu_mode 已从手动触发界面隐藏：本仓库的存在前提就是集成 KernelSU，
      # 不存在"不集成 KSU"的常规用法。功能代码未删除——build.yml 的
      # workflow_call 仍保留该输入，需要时取消下面注释并恢复 with: 透传即可。
#       ksu_mode:
#         description: "KernelSU 模式：关闭=正常集成 KernelSU / 禁用KSU=不集成任何 KernelSU 代码（SUSFS 的启停由 enable_susfs 独立控制，不要写在这里）"
#         required: false
#         type: choice
#         options:
#           - "关闭"
#           - "禁用KSU"
#         default: "关闭"
jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      android_version: ${{ steps.resolve.outputs.android_version }}
      sub_level: ${{ steps.resolve.outputs.sub_level }}
      kernel_full: ${{ steps.resolve.outputs.kernel_full }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: 检出版本数据
        uses: actions/checkout@v7

      - name: 解析安全补丁级别
        id: resolve
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          BUILD_SCOPE: ${{ inputs.build_scope }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          kernel_version = os.environ["KERNEL_VERSION"]
          os_patch_level = os.environ["OS_PATCH_LEVEL"].strip()
          # 构建范围为下拉选择，优先级高于手填的构建目标
          build_scope = os.environ.get("BUILD_SCOPE", "指定版本").strip()
          if build_scope == "全部版本":
              os_patch_level = "all"
          elif build_scope == "仅 LTS":
              os_patch_level = "lts"
          print(f"构建范围: {build_scope} -> os_patch_level={os_patch_level}")
          android_map = {
              "5.10": "android12",
              "5.15": "android13",
              "6.1": "android14",
              "6.6": "android15",
              "6.12": "android16",
          }
          android_version = android_map.get(kernel_version)
          if android_version is None:
              print(f"::error::未适配的内核版本: {kernel_version}")
              sys.exit(1)

          data_path = Path("data") / android_version / f"{kernel_version}.json"

          if not data_path.exists():
              print(f"::error::未找到版本数据: {data_path}")
              sys.exit(1)

          with data_path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          entries = data.get("entries", [])
          prefix = f"{kernel_version}."

          # 供错误提示使用：列出该内核全部可用子版本代号
          available_subs = []
          for entry in entries:
              k = entry.get("kernel", "")
              if k.startswith(prefix):
                  s = k.rsplit(".", 1)[-1]
                  if s not in available_subs:
                      available_subs.append(s)
          available_hint = "子版本代号: " + ", ".join(available_subs)

          # ---------- 解析用户请求的补丁级别列表 ----------
          # 支持：all / lts / latest / 单个日期 / 逗号分隔多个日期
          mode = os_patch_level.lower()
          if mode == "all":
              # 同一内核版本可能被多个补丁级别复用（如 5.10.43 对应 2021-08/09/10），
              # 这里按内核版本去重，只保留该版本最新的那个补丁级别。
              newest_date_by_kernel = {}
              for entry in entries:
                  k = entry.get("kernel", "")
                  if k:
                      newest_date_by_kernel[k] = entry.get("date")
              try:
                  ordered = sorted(
                      newest_date_by_kernel.items(),
                      key=lambda kv: int(kv[0].rsplit(".", 1)[-1]),
                  )
              except ValueError:
                  ordered = list(newest_date_by_kernel.items())
              wanted = [d for _, d in ordered]
              if data.get("lts"):
                  wanted.append("lts")
          elif mode == "latest":
              wanted = [entries[-1].get("date")] if entries else []
          else:
              wanted = [p.strip() for p in os_patch_level.split(",") if p.strip()]

          include = []
          seen = set()
          for patch in wanted:
              if patch.lower() == "lts":
                  kernel_full = data.get("lts")
                  if not kernel_full:
                      print(f"::error::{android_version} / {kernel_version} 缺少 LTS 版本数据")
                      sys.exit(1)
                  item = {"sub_level": "X", "os_patch_level": "lts", "kernel_full": kernel_full}
              else:
                  # 既支持补丁级别日期（2022-01），也支持子版本代号（66 / 236）
                  if patch.isdigit():
                      candidates = [
                          entry for entry in entries
                          if entry.get("kernel") == f"{kernel_version}.{patch}"
                      ]
                      if not candidates:
                          print(f"::error::未找到 {android_version} / {kernel_version}.{patch} 对应的版本数据")
                          print(f"::error::{available_hint}")
                          sys.exit(1)
                      # 同一子版本可能对应多个补丁级别，取最新的那个
                      matched = candidates[-1]
                  else:
                      matched = next(
                          (entry for entry in entries if entry.get("date") == patch),
                          None,
                      )
                      if matched is None:
                          print(f"::error::未找到 {android_version} / {kernel_version} / {patch} 对应的版本数据")
                          print(f"::error::可填补丁级别日期（如 2022-01）或子版本代号（如 66）")
                          print(f"::error::{available_hint}")
                          sys.exit(1)
                  kernel_full = matched.get("kernel", "")
                  if not kernel_full.startswith(prefix):
                      print(f"::error::版本数据异常: {kernel_full} 不属于 {kernel_version}")
                      sys.exit(1)
                  item = {
                      "sub_level": kernel_full.rsplit(".", 1)[-1],
                      "os_patch_level": matched.get("date"),
                      "kernel_full": kernel_full,
                  }
              key = (item["sub_level"], item["os_patch_level"])
              if key in seen:
                  continue
              seen.add(key)
              include.append(item)

          if not include:
              print(f"::error::未能解析出任何构建目标，请检查 os_patch_level: {os_patch_level}")
              sys.exit(1)

          matrix = {"include": include}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"android_version={android_version}\n")
              # 兼容旧引用：取第一个目标
              output.write(f"sub_level={include[0]['sub_level']}\n")
              output.write(f"kernel_full={include[0]['kernel_full']}\n")
              output.write("matrix<<__MATRIX_EOF__\n")
              output.write(json.dumps(matrix, ensure_ascii=False))
              output.write("\n__MATRIX_EOF__\n")

          print(f"解析结果: {android_version} / {kernel_version}，共 {len(include)} 个构建目标")
          for item in include:
              print(f"   - {item['kernel_full']}  ({item['os_patch_level']})")
          PY

  build-custom-kernel:
    name: "${{ matrix.kernel_full }}-${{ needs.resolve-version.outputs.android_version }}-${{ matrix.os_patch_level }}"
    needs: [resolve-version, get-ksu-manager]
    # 管理器拉取失败时不阻塞内核构建（ksuCommit 为空则内核跟随 main HEAD）
    if: ${{ !cancelled() && needs.resolve-version.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-version.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ needs.resolve-version.outputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      revision: "r1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      # 内核侧 KernelSU 检出到所选 Manager 构建的同一提交，
      # 使内核 KSU 版本与拉取的管理器安装包严格一致（BakaSU 生效）。
      # 显式填了「内核 KSU 对齐提交」时以它为准：自动对齐只跟随管理器 APK
      # 对应的构建提交，用户无法直接指定内核版本，这里补上这个缺口。
      ksu_commit: ${{ inputs.ksu_commit || needs.get-ksu-manager.outputs.ksuCommit }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      # 与 use_bbr 解耦：各自独立取值（见上方 input 定义处的说明）。
      use_net_enhance: ${{ inputs.use_net_enhance || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.enable_susfs }}
      # ksu_mode 不传：build.yml 默认「关闭」（正常集成 KernelSU）。
      droidspaces: ${{ inputs.droidspaces || '不启用' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      send_telegram: ${{ inputs.send_telegram || false }}
      use_release_cache: ${{ inputs.use_release_cache || false }}
      manager_commit: ${{ inputs.manager_commit }}
  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      manager_spoofed: true
      manager_commit: ${{ inputs.manager_commit }}