name: 内核构建 - Android 16 (6.12)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
          - Official
          - Next
        default: BakaSU
      enable_susfs:
        description: "集成 SUSFS"
        required: false
        type: boolean
        default: true
      # 6.12 上 KPM 恒不生效，默认关闭以免"勾了却空转"：
      # build_kernel.sh 在内核 >= 6.10 时强制 KPM_SUPPORTED=0
      # （SukiSU 的 drivers/kernelsu/kpm/super_access.c 用了 6.10+ 已移除的
      #  netlink_kernel_cfg.cb_mutex，编译必失败），相关阶段全部跳过。
      # 注意描述里不能写"6.6 不支持"——6.6 是支持的，不支持的是 6.12 及以上。
      use_kpm:
        description: "KPM 模块支持（编译后修补 Image。6.12 及以上不支持：SukiSU 的 KPM 代码用了新内核已移除的 netlink_kernel_cfg.cb_mutex）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补)"
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "不启用"
          - "启用"
        default: "不启用"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

      # ==================== 文本输入 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Thu Sep 17 00:00:00 UTC 2026"

      # ==================== 开关（默认关闭） ====================
      # 6.12 上 ZRAM 恒不生效，默认关闭以免"勾了却空转"：
      # 上游 SukiSU_patch 的 other/zram/zram_patch/ 只有 5.10 / 5.15 / 6.1 / 6.6
      # 四个目录，没有 6.12，setup_zram_lz4 与 config_zram 两阶段会整段跳过。
      use_zram:
        description: "启用 ZRAM 增强算法（6.12 暂无 lz4k 补丁栈，开启无效）"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_net_enhance:
        description: "启用网络增强（IPSet + BBR + FQ 队列 + IPv6 NAT + 附加拥塞算法）"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "可选功能不兼容或失败时自动跳过，而非中断构建（SUSFS 与一加 8E 除外）"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持（非一加勿开）"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 NTSync 支持（需先启用 Droidspaces）"
        required: false
        type: boolean
        default: false
      send_telegram:
        description: "发送 Telegram 通知（需配置 secrets）"
        required: false
        type: boolean
        default: true
      use_release_cache:
        description: "用 GitHub Release 存储 ccache"
        required: false
        type: boolean
        default: false
      ksu_branch_mode:
        description: "SukiSU 拉取分支：auto=跟随SUSFS开关自动选 / main=纯管理器分支 / builtin=内核内置实现（仅 SukiSU 生效）"
        required: false
        type: choice
        options:
          - "auto"
          - "main"
          - "builtin"
        default: "auto"
      manager_commit:
        description: "提交 hash（合并输入框）：<管理器&内核KSU>,<SUSFS>，逗号或竖线分隔均可，0 = 该段不指定。例：0,def456...(只锁 SUSFS) / abc123...,0(只锁管理器与内核)；留空则不锁定"
        required: false
        type: string
        default: ""
      # ksu_mode 已从手动触发界面隐藏：本仓库的存在前提就是集成 KernelSU，
      # 不存在"不集成 KSU"的常规用法。功能代码未删除——build.yml 的
      # workflow_call 仍保留该输入，需要时取消下面注释并恢复 with: 透传即可。
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Thu Sep 17 00:00:00 UTC 2026"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_net_enhance:
        description: "启用网络增强（IPSet + BBR + FQ 队列 + IPv6 NAT + 附加拥塞算法）"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "可选功能不兼容或失败时自动跳过，而非中断构建（SUSFS 与一加 8E 除外）"
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      enable_susfs:
        description: "集成 SUSFS"
        required: false
        type: boolean
        default: true
      supp_op:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "不启用"
      artifact_upload_mode:
        required: false
        type: string
        default: "上传全部"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        description: "导出 SUSFS 集成补丁（由 main.yml 传入）"
        required: false
        type: boolean
        default: false

      send_telegram:
        description: "发送 Telegram 通知（需配置 secrets）"
        required: false
        type: boolean
        default: true
      use_release_cache:
        description: "用 GitHub Release 存储 ccache"
        required: false
        type: boolean
        default: false
      ksu_branch_mode:
        description: "SukiSU 拉取分支：auto=跟随SUSFS开关自动选 / main=纯管理器分支 / builtin=内核内置实现（仅 SukiSU 生效）"
        required: false
        type: string
        default: "auto"
      manager_commit:
        description: "提交 hash（合并输入框）：<管理器&内核KSU>,<SUSFS>，逗号或竖线分隔均可，0 = 该段不指定。例：0,def456...(只锁 SUSFS) / abc123...,0(只锁管理器与内核)；留空则不锁定"
        required: false
        type: string
        default: ""
      ksu_commit:
        description: "对齐用：内核 KernelSU 检出到该提交（所选 Manager 构建同一提交；留空跟随 main HEAD）"
        required: false
        type: string
        default: ""
      ksu_mode:
        description: "KernelSU 模式：关闭=正常集成 KernelSU / 禁用KSU=不集成任何 KernelSU 代码（SUSFS 的启停由 enable_susfs 独立控制，不要写在这里）"
        required: false
        type: string
        default: "关闭"
jobs:
  # 矩阵改由 .github/workflows/config/matrix.json 生成。
  # 自动更新走 auto（6.12 不在其中，故为空、行为等同跳过）；
  # 手动触发走 full（23/30/38/58）。
  prepare-matrix:
    name: "生成构建矩阵"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - name: 生成构建矩阵
        id: gen
        env:
          MODE: ${{ inputs.called_from_main && 'auto' || 'full' }}
        run: |
          set -euo pipefail
          # auto 模式不含 6.12：脚本会输出空矩阵，下游 build job 的
          # `if: needs.prepare-matrix.outputs.count != '0'` 据此跳过。
          python3 scripts/gen_matrix.py --mode "$MODE" --android android16 --github-output
          if [ "$MODE" = "auto" ]; then
            echo "::notice::6.12 不在自动矩阵（auto 模式），本工作流跳过构建；" \
                 "如需 6.12 请在 main.yml 勾选 build_a16_6_12（Auto_Trigger 勾选 include_612）"
          fi

  build-kernels-a16-6-12:
    needs: [prepare-matrix, get-ksu-manager]
    # 管理器拉取失败/被跳过时不阻塞内核构建（ksuCommit 为空则内核跟随 main HEAD）
    if: ${{ !cancelled() && needs.prepare-matrix.result == 'success' }}
    name: "6.12.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    if: needs.prepare-matrix.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android16"
      kernel_version: "6.12"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      # 内核对齐：KernelSU 检出到所选 Manager 构建同一提交（BakaSU 生效）
      ksu_commit: ${{ inputs.ksu_commit }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      # 这里原本写死 false，把 use_zram 的默认值（true）静默盖掉 ——
      # UI 上看着勾了 ZRAM，实际构建却没开。6.12 上 ZRAM 的真实处置交给
      # 脚本：上游 lz4k 补丁栈只到 6.6，没有就整段跳过并告警，别在这里替它决定。
      use_zram: ${{ inputs.use_zram || false }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_net_enhance: ${{ inputs.use_net_enhance || false }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches || false }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.enable_susfs }}
      # ksu_mode 不传：build.yml 默认「关闭」（正常集成 KernelSU）。
      droidspaces: ${{ inputs.droidspaces || '不启用' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      send_telegram: ${{ inputs.send_telegram || false }}
      use_release_cache: ${{ inputs.use_release_cache || false }}
      manager_commit: ${{ inputs.manager_commit }}
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}
  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      manager_spoofed: true
      manager_commit: ${{ inputs.manager_commit }}
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}