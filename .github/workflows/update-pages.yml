name: Update Data & Deploy Pages

on:
  schedule:
    - cron: '0 8 */3 * *'  # 每 3 天 UTC 8:00
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'web/**'
      - 'scripts/**'
      # 9c6d1f8：scripts/susfs_fixes/ 是构建期由 build.yml 调用的补丁修复脚本，
      # 与版本数据抓取无关，改它不该触发数据刷新 + Pages 重部署
      - '!scripts/susfs_fixes/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-24.04
    # 注意：data-changed 当前未被消费（deploy-pages 用 needs 无条件依赖、
    # 从不读该输出，所以无数据变化也会重新部署）。仅保留声明，不改变行为。
    outputs:
      data-changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run incremental update
        working-directory: scripts
        run: |
          set +e
          python update_data.py
          exit_code=$?
          set -e
          # 约定的退出码：0 = 有变更，2 = 无变更，1 = 真实错误。
          # 其余任何非零码（信号中断 137、解释器崩溃等）都不在白名单里，
          # 必须同样中止，否则坏数据会被当成"无变更"静默带过。
          case "$exit_code" in
            0) echo "update_data.py: 数据有变更" ;;
            2) echo "update_data.py: 数据无变更" ;;
            1) echo "::error::update_data.py 执行失败（退出码 1）"; exit 1 ;;
            *) echo "::error::update_data.py 返回未预期的退出码 $exit_code"; exit 1 ;;
          esac

      - name: Update full build matrix
        run: python3 scripts/update_full_matrix.py

      - name: Commit data changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ .github/workflows/config/matrix.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit."
          else
            git commit -m "chore: update GKI kernel version data"
            # 与并发的 Auto_Trigger（同样会 push）存在竞态：被拒时先 rebase 再重试，
            # 避免整个数据更新因一次 push 竞争而丢失。
            if ! git push; then
              echo "首次 push 被拒，rebase 后重试"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
              git push
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    # 原为硬编码上游仓库，fork 后 Pages 部署永不执行；改为当前仓库即可
    if: ${{ contains(fromJSON('["zzh20188/GKI_KernelSU_SUSFS", "Lokitla/GKI_SUKISU_SUSFS_for_Lokita"]'), github.repository) }}
    needs: update-data
    runs-on: ubuntu-24.04
    env:
      # 经 job 级 env 转一手，避免把 ${{ }} 直接内插进 run 块（与全仓其余
      # 工作流保持同一种写法）。
      REF_NAME: ${{ github.ref_name }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 上游写死 ref: dev，但本仓库没有 dev 分支（只有 main / sha），checkout 直接失败。
      # 改为跟随触发分支，仓库改名或换默认分支都不会再踩坑。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Pull latest data
        run: git pull origin "$REF_NAME"

      - name: Copy data to web directory
        run: cp -r data/ web/data/

      # 构建前端资源（webpack 打包 JS/SCSS → dist/）
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web assets
        working-directory: web
        run: npm ci && npx webpack --mode production

      # 448d9ee：Pages 产物只需要页面、dist/、data/ 与 assets/，
      # node_modules 有 40MB 以上，上传前清掉
      - name: Trim Pages artifact
        run: rm -rf web/node_modules

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
