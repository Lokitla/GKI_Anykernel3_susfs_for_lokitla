# =============================================================================
# BakaSU 上游更新检测 → 自动触发内核构建
# -----------------------------------------------------------------------------
# 跟踪分支 sha-bakasu：记录 BakaSU 上游 main 的最新提交号。该分支由旧名
# sha-resukisu 迁移而来（上游原名 ReSukiSU，后更名 BakaSU），基线提交号原样保留。
# 流程：拉取 Baka-SU/BakaSU main 最新提交号 → 与 sha-bakasu 分支记录的旧值
#       比对 → 有更新则回写 sha-bakasu 分支，并按 build_scope 触发构建。
#
# 与 Auto_Trigger_SukiSU.yml 是一对：两者逻辑相同，差别只在「检测哪个上游仓库、
# 回写哪个基线分支、用哪个变体构建、什么时刻跑」。拆开的原因是 BakaSU 与
# SukiSU 上游是两个独立仓库、互不相关的发布节奏，合并成一个 workflow 时只能
# 检测其中一个却构建另一个（语义错位），且两条本领跑也无法各自设日程。
#
# 定期日程刻意与 SukiSU 那条错开 12 小时：两路同时开跑会互相抢 Actions 并发
# 配额，也会让 Release 时间挤在一起难分辨。
#
# 关于默认范围：默认跑「全部版本」，即 5.10 / 5.15 / 6.1 / 6.6 的维护矩阵。
#
# 矩阵不在 workflow 里硬编码，由 .github/workflows/config/matrix.json 维护：
#   auto —— 自动更新用（本 workflow → main.yml），共 19 个组合：
#           5.10 : 136, 198, 209, 236, X(LTS)
#           5.15 : 74, 123, 148, 170, 178, 180
#           6.1  : 78, 90, 99, 124, 145
#           6.6  : 50, 66, 102
#           刻意不跑上游那样的 80 个全量：早期子版本（5.10.66/81/101…）实质
#           已无人使用，编出来只占 Release 体积和 CI 时长。
#
#   full —— 手动触发用（直接跑 kernel-*.yml），共 91 个组合，保留全部历史子版本。
#           不做删除处理，只是默认不自动跑。
#
# 分流靠 kernel-*.yml 的 called_from_main 入参：main.yml 调用时传 true → auto，
# 手动直接触发时为默认的 false → full。
#
# 关于 6.12 上的 KPM：
#   SukiSU 的 drivers/kernelsu/kpm/super_access.c 用了 netlink_kernel_cfg.cb_mutex
#   与 DYNAMIC_STRUCT_END(netlink_kernel_cfg)，在 6.10+ 上编不过。启用 KPM 时
#   第一次构建必失败，要靠 COMPILE_MAX_ATTEMPTS 重试丢掉 ksu.fragment 才出包，
#   每版多花约 18 分钟；现在早期闸门直接把 KPM_SUPPORTED 置 0 自动关闭。
#   → KPM 在 6.12 上等于不可用，需要 KPM 只能用 ≤ 6.6 的内核。
#   另：BakaSU / Official / Next 变体本身就不提供 KPM，build_kernel.sh 会
#   警告后跳过 —— 载荷里仍传 patched 是故意的，将来上游补齐时可自动生效。
#
# 迁移注意：sha-bakasu 分支由原 sha-resukisu 原样迁移（latest_sha.txt 基线保留），
# 首次运行会读到旧值、不会误触发全矩阵构建。若基线分支重建（latest_sha.txt 丢失），
# 首次运行会视为「检测到新提交」并立刻触发一轮全矩阵构建；只想建立基线的话，
# 先手动跑一次本 workflow 并把 build_scope 选成「不构建」。
# =============================================================================
name: Auto Trigger on BakaSU Update

on:
  schedule:
    # 每三天 UTC 00:00 检查一次（与 SukiSU 那条的 UTC 12:00 错开）。
    # GitHub 的 cron 不保证准点，高峰期可能延后数十分钟，属正常现象。
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 忽略「是否有新提交」，强制触发一次构建
        type: boolean
        default: false
      build_scope:
        description: 检测到更新后要构建的范围
        type: choice
        default: 全部版本
        options:
          - 全部版本
          - 单版本冒烟
          - 固定 5.10.236
          - 不构建
      include_612:
        description: 尝试把 Android 16 (6.12) 纳入矩阵。注意：6.12 不在 auto 精简矩阵内，勾选后自动构建仍会跳过 6.12；构建 6.12 请手动触发「内核构建 - Android 16 (6.12)」入口
        type: boolean
        default: false
      release_type:
        description: 构建完成后的发布方式
        type: choice
        default: Release
        options:
          - Release
          - Pre-Release
          - Actions

# 写：回写 sha-bakasu 分支；actions：调用 workflow_dispatch 接口触发构建
permissions:
  contents: write
  actions: write

# 同一时间只允许同一个变体的检测任务在跑，避免定时任务和手动触发互相踩。
# group 名带变体，两条 workflow 互不阻塞。
concurrency:
  group: auto-trigger-bakasu
  cancel-in-progress: false

jobs:
  check-and-trigger:
    runs-on: ubuntu-24.04
    # 仓库所有者白名单：fork 后需把自己的用户名加进来，否则自动构建永不触发
    if: contains(fromJSON('["zzh20188", "elysias123", "Lokitla"]'), github.repository_owner)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 获取 BakaSU 最新提交号
        id: get_sha
        run: |
          set -euo pipefail
          LATEST_SHA=$(curl -fsSL https://api.github.com/repos/Baka-SU/BakaSU/commits/main | jq -r '.sha')
          # API 限流或仓库改名时会拿到空值/null，这时宁可不触发，也不要带着空提交号去构建
          if [[ -z "$LATEST_SHA" || "$LATEST_SHA" == "null" ]]; then
            echo "::error::无法获取 BakaSU 最新提交号（API 限流或接口变更），本次跳过"
            exit 1
          fi
          echo "sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          echo "Latest SHA: $LATEST_SHA"

      - name: 读取 sha-bakasu 分支记录的旧提交号
        id: get_prev_sha
        env:
          SHA_BRANCH: sha-bakasu
        run: |
          set -euo pipefail
          PREV_SHA=""
          if git ls-remote --heads origin "$SHA_BRANCH" | grep -q "$SHA_BRANCH"; then
            echo "$SHA_BRANCH 分支存在，读取历史记录…"
            git fetch origin "$SHA_BRANCH:$SHA_BRANCH" || true
            git checkout "$SHA_BRANCH" || true
            if [ -f "latest_sha.txt" ]; then
              PREV_SHA=$(cat latest_sha.txt)
              echo "Previous SHA found: $PREV_SHA"
            else
              echo "$SHA_BRANCH 分支上没有 latest_sha.txt"
            fi
          else
            echo "$SHA_BRANCH 分支尚不存在，视为首次运行"
          fi
          echo "prev_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"
          git checkout "${{ github.ref_name }}"

      - name: 比对是否有新提交
        id: compare
        run: |
          set -euo pipefail
          CURR_SHA="${{ steps.get_sha.outputs.sha }}"
          PREV_SHA="${{ steps.get_prev_sha.outputs.prev_sha }}"
          FORCE="${{ inputs.force || 'false' }}"

          echo "Current SHA: $CURR_SHA"
          echo "Previous SHA: ${PREV_SHA:-<none>}"

          if [[ "$FORCE" == "true" ]]; then
            echo "new_commit=true"
            echo "new_commit=true" >> "$GITHUB_OUTPUT"
            echo "手动强制触发"
          elif [[ "$CURR_SHA" != "$PREV_SHA" ]]; then
            echo "new_commit=true" >> "$GITHUB_OUTPUT"
            echo "检测到新提交"
          else
            echo "new_commit=false" >> "$GITHUB_OUTPUT"
            echo "无新提交"
          fi

      - name: 上游 SUSFS 闸门健康检查
        id: health
        if: steps.compare.outputs.new_commit == 'true'
        env:
          LATEST_SHA: ${{ steps.get_sha.outputs.sha }}
        run: |
          set -uo pipefail
          # 命中挂起时 ok=false：既不回写 sha 也不触发构建。
          # 不回写是关键——上游解除挂起后，下次 cron 仍会判为"有新提交"并补建。
          if bash scripts/check_upstream_susfs.sh --variant BakaSU --ref "${LATEST_SHA:-main}"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::上游 SUSFS 已挂起，本次跳过构建且不回写 sha-bakasu（上游解除后会自动补建）"
          fi
      - name: 回写最新提交号到 sha-bakasu 分支
        if: steps.compare.outputs.new_commit == 'true' && steps.health.outputs.ok != 'false'
        env:
          SHA_BRANCH: sha-bakasu
        run: |
          set -euo pipefail
          git checkout "$SHA_BRANCH" 2>/dev/null || git checkout --orphan "$SHA_BRANCH"
          if [ ! -f "latest_sha.txt" ]; then
            git rm -rf . 2>/dev/null || true
          fi
          echo "${{ steps.get_sha.outputs.sha }}" > latest_sha.txt
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add latest_sha.txt
          git commit -m "chore(sha): 更新 BakaSU 最新提交号为 ${{ steps.get_sha.outputs.sha }}" || exit 0
          git push origin "$SHA_BRANCH"

      - name: 触发构建工作流
        if: steps.compare.outputs.new_commit == 'true' && steps.health.outputs.ok != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOPE: ${{ inputs.build_scope || '全部版本' }}
          RELEASE_TYPE: ${{ inputs.release_type || 'Release' }}
          INCLUDE_612: ${{ inputs.include_612 || 'false' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # 上一步（回写 sha-bakasu 分支）已经把工作区切到孤儿分支，那里只有
          # latest_sha.txt，没有 config/。锚点文件在主分支上，必须先切回来再读，
          # 否则自动触发的构建永远走零锚点。
          git checkout "$REF_NAME" 2>/dev/null || git checkout "${{ github.ref_name }}"

          # KPM 修补工具锚点（config/kpm_patch_sha256）不再透传：
          # 该配置项已从所有手动入口隐藏，行为等同于留空不校验，
          # 因此自动触发的构建一律为零锚点运行（与手动留空一致）。
          # 锚点机制本身保留在 build_kernel.sh / build.py --kpm-patch-sha256 中。
          #
          # 同理 manager_spoofed：该 input 也已从 main.yml / kernel-custom.yml 的
          # 手动入口隐藏（恒启用），main.yml → get-manager.yml 的调用处写死 true，
          # 所以这里不要再把它加回载荷 —— 加了到不了任何环节。

          case "$SCOPE" in
            "不构建")
              echo "本次只更新 sha-bakasu 分支，不触发构建"
              exit 0
              ;;
            "全部版本")
              # 完整矩阵走「构建内核」(main.yml)。
              # 构建目标用逗号分隔字符串 build_targets（替代原来的 5 个 build_a1x
              # 布尔开关已合并，以便腾出 25 个 input 名额）：6.12 按需追加，
              # 其余固定，避免 build_all 把 6.12 一起拉进来。
              # 实际组合数由 matrix.json 决定（当前 19 个）。
              BUILD_TARGETS="a12,a13,a14,a15"
              if [ "$INCLUDE_612" = "true" ]; then
                BUILD_TARGETS="$BUILD_TARGETS,a16"
              fi
              jq -n \
                --arg ref "$REF_NAME" \
                --arg release_type "$RELEASE_TYPE" \
                --arg build_targets "$BUILD_TARGETS" \
                '{
                  ref: $ref,
                  inputs: {
                    release_type: $release_type,
                    kernelsu_variant: "BakaSU",
                    enable_susfs: true,
                    use_kpm: "patched (开启并修补)",
                    droidspaces: "不启用",
                    build_time: "",
                    build_targets: $build_targets,
                    export_susfs_patches: true,
                    use_zram: true,
                    use_bbg: false,
                    use_rekernel: false,
                    cve_2026_43499_patch: false,
                    droidspaces_ntsync: false,
                    use_net_enhance: false,
                    send_telegram: true,
                    use_release_cache: false,
                    supp_op: false,
                    manager_commit: ""
                  }
                }' > /tmp/dispatch.json
              echo "6.12 纳入范围: $INCLUDE_612"
              TARGET_WF="main.yml"
              ;;
            "固定 5.10.236")
              # 走专用的固定 workflow（build-236-marble.yml）：那边的参数全部写死，
              # 面向 Redmi Note 12 Turbo（marble），配置为 BakaSU + zram + 网络
              # 增强 + rek + nomount。不需要传任何 inputs，所以载荷只有 ref。
              # 产物留在 Actions artifacts，不发 Release —— 它没有经过负责
              # gh release create 的 main.yml 编排层。
              # 改该文件名或删它时，必须同步改这里的 TARGET_WF，否则 dispatch 会 404。
              jq -n --arg ref "$REF_NAME" '{ ref: $ref }' > /tmp/dispatch.json
              TARGET_WF="build-236-marble.yml"
              ;;
            *)
              # 单版本冒烟走「Android 内核构建-自定义」(kernel-custom.yml)：
              # 只有它支持精确到单个子版本，一次只编 1 个，几分钟就有结果。
              # 5.10.66 是已实测可编的组合；只传 AnyKernel3 包，省掉三个 boot 镜像。
              jq -n \
                --arg ref "$REF_NAME" \
                '{
                  ref: $ref,
                  inputs: {
                    kernel_version: "5.10",
                    kernelsu_variant: "BakaSU",
                    enable_susfs: true,
                    use_kpm: "patched (开启并修补)",
                    droidspaces: "不启用",
                    artifact_upload_mode: "仅上传 AnyKernel3.zip",
                    build_scope: "指定版本",
                    os_patch_level: "66",
                    build_time: "",
                    use_zram: true,
                    use_bbg: false,
                    use_rekernel: false,
                    cve_2026_43499_patch: false,
                    supp_op: false,
                    droidspaces_ntsync: false,
                    send_telegram: true,
                    use_release_cache: false,
                    manager_commit: ""
                  }
                }' > /tmp/dispatch.json
              TARGET_WF="kernel-custom.yml"
              ;;
          esac

          echo "触发范围：$SCOPE → $TARGET_WF"

          # 注意：REST 字段是 inputs（复数）。写成 input 会被 422 拒掉。
          # 这里直接构造 JSON 载荷，避免 -f 嵌套字段写法在不同 gh 版本上的差异。
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/actions/workflows/$TARGET_WF/dispatches" \
            --input /tmp/dispatch.json

          echo "已触发 $TARGET_WF"
