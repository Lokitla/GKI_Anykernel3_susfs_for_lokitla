# =============================================================================
# GKI 内核构建工作流
# -----------------------------------------------------------------------------
# 核心构建逻辑已抽取至 scripts/build_kernel.sh（与 Python CLI build.py 共用），
# 本文件只保留 GitHub Actions 专属能力：缓存、产物上传、失败日志、Telegram 通知。
# 修改构建逻辑请改 scripts/build_kernel.sh，不要在本文件里重写 shell。
# =============================================================================
name: 内核构建流程
permissions:
  contents: write
  actions: write
'on':
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      ksu_variant:
        required: true
        type: string
      ksu_commit:
        description: "内核 KSU 对齐提交（备用）。界面上请填「提交 hash」合并输入框的第 1 段——管理器与内核 KSU 共用同一提交；本 input 仅在该段为 0/空时生效，kernel-custom.yml 用它承载自动对齐值"
        required: false
        type: string
        default: ""
      ksu_mode:
        description: "KernelSU 模式：关闭=正常集成 KernelSU / 禁用KSU=不集成任何 KernelSU 代码（SUSFS 的启停由 enable_susfs 独立控制）"
        required: false
        type: string
        default: 关闭
      version:
        required: false
        type: string
      revision:
        required: false
        type: string
        default: r1
      build_time:
        required: false
        type: string
        default: Thu Sep 17 00:00:00 UTC 2026
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      # [移植] 网络增强：IPSet 全类型 + BBR + FQ/FQ_CODEL + IPv6 NAT + 附加拥塞算法。
      # 全部是内核既有配置的启用，不引入第三方代码；默认关闭。
      use_net_enhance:
        description: "启用网络增强（IPSet + BBR + FQ 队列 + IPv6 NAT + 附加拥塞算法）"
        required: false
        type: boolean
        default: false
      # [移植] 兼容跳过：可选增强项失败时降级为警告并继续构建，而非中断。
      # SUSFS 与一加 8E 支持不在跳过范围内（二者失败仍中断），详见
      # scripts/build_kernel.sh 的 phase_skippable 白名单。
      skip_incompatible:
        description: "可选功能不兼容或失败时自动跳过，而非中断构建（SUSFS 与一加 8E 除外）"
        required: false
        type: boolean
        default: false
      # [移植] 27e129e NoMount 挂载元模块。二进制布尔，默认关闭；由 kernel-a1*.yml /
      # kernel-custom.yml 透传。main.yml 因 workflow_dispatch 的 25 input 上限已满，
      # 暂不在手动界面暴露（编排路径恒定 false）。
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        required: false
        type: boolean
        default: false
      enable_susfs:
        required: true
        type: boolean
      supp_op:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
        default: '不启用'
      artifact_upload_mode:
        description: "产物上传策略：上传全部=刷入包+启动镜像 / 仅上传 AnyKernel3.zip / 不上传（探测工作流用它避免上百个任务灌满存储配额）"
        required: false
        type: string
        default: 上传全部
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      use_bbr:
        description: 设置 BBR 为默认拥塞算法
        required: false
        type: boolean
        default: false
      send_telegram:
        description: 发送 Telegram 通知（需配置 secrets）
        required: false
        type: boolean
        default: false
      use_release_cache:
        description: 用 GitHub Release 存储 ccache
        required: false
        type: boolean
        default: false
      ksu_branch_mode:
        description: "SukiSU 拉取分支：auto=跟随SUSFS开关自动选 / main=纯管理器分支 / builtin=内核内置实现（仅 SukiSU 生效）"
        required: false
        type: string
        default: "auto"
      # 合并输入框：界面上只暴露「管理器提交 hash」，内容为逗号分隔的两个 hash。
      # 解析在本工作流的 resolve-commits 步骤完成（GitHub 表达式没有 split 函数，
      # 无法在 with: 里直接拆），拆分结果仍走原有的 SUKISU_COMMIT / SUSFS_COMMIT
      # 校验逻辑，行为不变。
      manager_commit:
        description: "管理器提交 hash（SukiSU/管理器 hash，可选逗号后接 SUSFS hash；留空则不锁定）"
        required: false
        type: string
        default: ""
      # 以下两个为兼容保留：直接调用本工作流时仍可分别传入。
      # 与 manager_commit 同时给出时，以 manager_commit 为准。
      sukisu_commit:
        description: "SukiSU 提交 hash：内核与管理器统一使用该 commit（留空则用 config/config 或最新）"
        required: false
        type: string
        default: ""
      susfs_commit:
        description: "SUSFS 提交 hash：内核 SUSFS 修补使用该 commit（留空则取 config/config 或分支最新）"
        required: false
        type: string
        default: ""
      # 以下三项供 susfs-probe 探测工作流使用（校准网页上的 SUSFS 兼容线）
      susfs_raw_probe:
        description: "SUSFS 原始补丁探测：跳过适配修复，直接用未经修补的原始补丁构建"
        required: false
        type: boolean
        default: false
      susfs_side_fixes:
        description: "探测模式下保留与子版本无关的 SUSFS 侧修复（5.10 上游补丁自身的两处编译缺陷）"
        required: false
        type: boolean
        default: false
      susfs_pin_time:
        description: "把 susfs4ksu 固定到该时刻之前的最后一次提交（ISO 8601，留空=不固定）"
        required: false
        type: string
        default: ""
      # kpm_patch_sha256 已从所有手动入口隐藏：留空即不校验，是唯一常规用法。
      # 底层校验逻辑（EXPECTED_KPM_PATCH_SHA256）保留在 build_kernel.sh 中，
      # 本地 build.py --kpm-patch-sha256 仍可显式传入。
jobs:
  build-kernel:
    name: ${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ inputs.ksu_variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_HARDLINK: 'true'
    steps:
    - name: 检出代码仓库
      uses: actions/checkout@v7
    # 界面上「提交 hash」是合并后的单个输入框，这里拆回各段。
    # GitHub 表达式没有 split，所以必须落在有 shell 的这一步。
    #
    # 合并输入框语法（逗号或竖线分隔均可，0 = 该段不指定）：
    #   <管理器&内核KSU>,<SUSFS>     例：abc123...,def456...  两段都锁
    #   0,def456...                 只锁 SUSFS，管理器与内核不指定
    #   abc123...,0                 只锁管理器与内核，SUSFS 不指定
    #   abc123...|def456...         竖线分隔，等价
    # 第 1 段同时供「管理器 APK」与「内核 KSU 对齐」使用（二者共用同一提交）。
    # 段值为 0 或空时不覆盖对应的独立 input（sukisu_commit / susfs_commit）。
    - name: 解析提交 hash（合并输入框）
      id: resolve_commits
      # 安全：外部输入一律经 env 传入，run 块中不出现 ${{ }}
      env:
        MANAGER_COMMIT: ${{ inputs.manager_commit }}
        SUKISU_COMMIT_IN: ${{ inputs.sukisu_commit }}
        SUSFS_COMMIT_IN: ${{ inputs.susfs_commit }}
      run: |
        set -eu
        sukisu="$SUKISU_COMMIT_IN"
        susfs="$SUSFS_COMMIT_IN"
        if [ -n "$MANAGER_COMMIT" ]; then
          # 归一化：去掉空白与引号，便于直接粘贴 0,"abc..." / "abc",0 这类写法
          raw=$(printf '%s' "$MANAGER_COMMIT" | tr -d '[:space:]' | tr -d '"' | tr -d "'")
          # 分隔符支持逗号或竖线，取先出现的那种（两者混用时按先出现的算）
          case "$raw" in
            *"|"*) SEP='|' ;;
            *)     SEP=',' ;;
          esac
          # 拆两段：第 1 段=管理器&内核KSU 共用，第 2 段=SUSFS
          seg1="${raw%%$SEP*}"
          if [ "$seg1" = "$raw" ]; then
            seg2=""
          else
            seg2="${raw#*$SEP}"
            seg2="${seg2%%$SEP*}"
          fi
          # 0 = 该段不指定
          if [ "$seg1" = "0" ]; then seg1=""; fi
          if [ "$seg2" = "0" ]; then seg2=""; fi
          # 超过两段时忽略第 3 段及之后
          if [ -n "$seg2" ] && [ "${raw#*$SEP*$SEP}" != "$raw" ]; then
            echo "::warning::管理器提交 hash 超过两段，已忽略第 3 段及之后的内容"
          fi
          # 只有显式给出（非 0、非空）的段才覆盖
          if [ -n "$seg1" ]; then sukisu="$seg1"; fi
          if [ -n "$seg2" ]; then susfs="$seg2"; fi
        fi
        # 保留原有校验：只允许 40 位（SHA-1）或 64 位（SHA-256）十六进制
        for entry in "SukiSU/管理器:$sukisu" "SUSFS:$susfs"; do
          label=${entry%%:*}; val=${entry#*:}
          [ -z "$val" ] && continue
          case "$val" in
            *[!0-9a-fA-F]*)
              echo "::error::非法的 ${label} commit（只允许十六进制字符）: $val"; exit 1 ;;
          esac
          if [ "${#val}" != "40" ] && [ "${#val}" != "64" ]; then
            echo "::error::非法的 ${label} commit 长度（需 40 或 64 位）: $val"; exit 1
          fi
        done
        echo "sukisu_commit=$sukisu" >> "$GITHUB_OUTPUT"
        echo "susfs_commit=$susfs" >> "$GITHUB_OUTPUT"
        # 内核 KSU 对齐与管理器共用第 1 段（见 KSU_COMMIT 处注释）
        echo "ksu_commit=$sukisu" >> "$GITHUB_OUTPUT"
        echo "解析结果: 管理器&内核KSU='${sukisu:-<不锁定>}'  SUSFS='${susfs:-<不锁定>}'"
    - name: 应用自定义提交
      if: ${{ inputs.manager_commit != '' || inputs.sukisu_commit != '' || inputs.susfs_commit != '' }}
      # 安全：所有外部输入一律经 env 传入，run 块中不得出现 ${{ }}。
      # ${{ }} 在 shell 解析之前完成文本替换，直接内插会形成 Actions 注入面。
      env:
        SUKISU_COMMIT: ${{ steps.resolve_commits.outputs.sukisu_commit }}
        SUSFS_COMMIT: ${{ steps.resolve_commits.outputs.susfs_commit }}
        SUSFS_RAW_PROBE: ${{ inputs.susfs_raw_probe || false }}
        SUSFS_SIDE_FIXES: ${{ inputs.susfs_side_fixes || false }}
        SUSFS_PIN_TIME: ${{ inputs.susfs_pin_time || '' }}
        ANDROID_VERSION: ${{ inputs.android_version }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
      run: |
        set -eu
        SUSFS_BRANCH="gki-$ANDROID_VERSION-$KERNEL_VERSION"
        SUSFS_BRANCH_ESC="${SUSFS_BRANCH//./\\.}"
        echo "目标 SUSFS 分支键名: $SUSFS_BRANCH"
        # 仅接受纯 40/64 位十六进制 commit hash，杜绝 sed 表达式注入
        if [ -n "$SUKISU_COMMIT" ]; then
          case "$SUKISU_COMMIT" in
            *[!0-9a-fA-F]*|'') echo "::error::非法的 SukiSU commit: $SUKISU_COMMIT"; exit 1 ;;
          esac
          [ "${#SUKISU_COMMIT}" = "40" ] || [ "${#SUKISU_COMMIT}" = "64" ] || {
            echo "::error::commit 长度必须为 40 或 64 位: $SUKISU_COMMIT"; exit 1; }
        fi
        if [ -n "$SUSFS_COMMIT" ]; then
          case "$SUSFS_COMMIT" in
            *[!0-9a-fA-F]*|'') echo "::error::非法的 SUSFS commit: $SUSFS_COMMIT"; exit 1 ;;
          esac
          [ "${#SUSFS_COMMIT}" = "40" ] || [ "${#SUSFS_COMMIT}" = "64" ] || {
            echo "::error::commit 长度必须为 40 或 64 位: $SUSFS_COMMIT"; exit 1; }
        fi
        sed -i 's/^custom=.*/custom=true/' config/config
        if [ -n "$SUKISU_COMMIT" ]; then
          sed -i "s|^sukisu=.*|sukisu=$SUKISU_COMMIT|" config/config
          echo "SukiSU 固定提交: $SUKISU_COMMIT"
        fi
        if [ -n "$SUSFS_COMMIT" ]; then
          # P2-4 修复：替换侧转义 &，避免 SUSFS_BRANCH 含 & 时被 sed 当作整匹配引用
          SUSFS_BRANCH_REPL="${SUSFS_BRANCH//&/\&}"
          sed -i "s|^${SUSFS_BRANCH_ESC}=.*|${SUSFS_BRANCH_REPL}=$SUSFS_COMMIT|" config/config
          echo "SUSFS 固定提交: $SUSFS_COMMIT"
        fi
        echo "--- config/config 生效内容 ---"
        grep -E "^(custom|sukisu|${SUSFS_BRANCH_ESC})=" config/config || echo "(未匹配到，使用默认分支)"
    - name: 恢复 Release 缓存（可选）
      if: ${{ inputs.use_release_cache }}
      uses: ./.github/actions/cache-restore
      with:
        cache_path: /home/runner/.ccache
        cache_key: ${{ github.ref_name }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}
        cache_bucket: ccache-cache
        cache_sign_key: ${{ secrets.CACHE_SIGN_KEY }}
    # 探测模式（susfs-probe）一次会起上百个子版本任务，照常写回缓存会把这些
    # 一次性 key 灌满仓库的 10GB 配额、把 dev 的常用热缓存挤掉，
    # 所以探测走只读恢复（actions/cache/restore），只取不存。
    - name: 恢复 ccache 缓存（探测，只读）
      if: ${{ inputs.susfs_raw_probe }}
      uses: actions/cache/restore@v5
      with:
        path: ~/.ccache
        key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
        restore-keys: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-
    - name: 恢复 ccache 缓存
      if: ${{ !inputs.susfs_raw_probe }}
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
        restore-keys: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-
    - name: 恢复 bazel 磁盘缓存（探测，只读）
      if: ${{ inputs.susfs_raw_probe && inputs.android_version != 'android12' && inputs.android_version != 'android13' }}
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/bazel
        key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-${{ github.sha }}
        restore-keys: '${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-

          ${{ inputs.android_version }}-${{ inputs.kernel_version }}-bazel-'
    - name: 恢复 bazel 磁盘缓存
      if: ${{ !inputs.susfs_raw_probe && inputs.android_version != 'android12' && inputs.android_version != 'android13' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/bazel
        key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-${{ github.sha }}
        restore-keys: '${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-

          ${{ inputs.android_version }}-${{ inputs.kernel_version }}-bazel-'
    - name: 缓存工具链
      id: cache-toolchain
      uses: actions/cache@v5
      with:
        path: 'kernel-build-tools

          mkbootimg'
        key: toolchain-${{ runner.os }}-v1
    - name: 上游 SUSFS 闸门健康检查（fail-fast）
      # BakaSU 上游会在 kernel/tools/susfs_compat.mk 末尾追加无条件的
      # $(error Please wait susfs update.) 主动挂起 SUSFS 构建
      # （2026-10-10 提交 48fa4bb）。原行为要等到 compile_kernel 阶段编
      # drivers/kernelsu 才失败，整轮白跑 20+ 分钟。这里提前探测，命中立刻停。
      # 探测 ref 跟随内核实际要检出的提交：填了对齐提交就查它，否则查 main。
      if: ${{ inputs.enable_susfs && inputs.ksu_variant == 'BakaSU' }}
      env:
        KSU_VARIANT_IN: ${{ inputs.ksu_variant }}
        # 与实际检出保持一致：同样优先取合并输入框第 1 段
        KSU_COMMIT_IN: ${{ steps.resolve_commits.outputs.ksu_commit || inputs.ksu_commit }}
      run: |
        bash scripts/check_upstream_susfs.sh \
          --variant "$KSU_VARIANT_IN" \
          --ref "${KSU_COMMIT_IN:-main}"
    - name: 构建内核
      id: build
      run: bash scripts/build_kernel.sh --all
      env:
        ANDROID_VERSION: ${{ inputs.android_version }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
        SUB_LEVEL: ${{ inputs.sub_level }}
        OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        KSU_VARIANT: ${{ inputs.ksu_variant }}
        KSU_MODE: ${{ inputs.ksu_mode }}
        VERSION: ${{ inputs.version }}
        REVISION: ${{ inputs.revision }}
        BUILD_TIME: ${{ inputs.build_time }}
        USE_ZRAM: ${{ inputs.use_zram }}
        USE_BBG: ${{ inputs.use_bbg }}
        USE_KPM: ${{ inputs.use_kpm }}
        USE_REKERNEL: ${{ inputs.use_rekernel }}
        USE_NET_ENHANCE: ${{ inputs.use_net_enhance || false }}
        SKIP_INCOMPATIBLE: ${{ inputs.skip_incompatible || false }}
        USE_NOMOUNT: ${{ inputs.use_nomount || false }}
        CVE_2026_43499_PATCH: ${{ inputs.cve_2026_43499_patch }}
        EXPORT_SUSFS_PATCHES: ${{ inputs.export_susfs_patches }}
        EXPECTED_KPM_PATCH_SHA256: ""
        ENABLE_SUSFS: ${{ inputs.enable_susfs }}
        SUPP_OP: ${{ inputs.supp_op }}
        DROIDSPACES: ${{ inputs.droidspaces }}
        DROIDSPACES_NTSYNC: ${{ inputs.droidspaces_ntsync }}
        ARTIFACT_UPLOAD_MODE: ${{ inputs.artifact_upload_mode }}
        USE_BBR: ${{ inputs.use_bbr }}
        # BakaSU 对齐：内核 KernelSU 检出到该提交（空=跟随 main HEAD）。
        # 优先级：合并输入框第 1 段（管理器&内核KSU 共用）> 本 input（承载自动对齐值）。
        KSU_COMMIT: ${{ steps.resolve_commits.outputs.ksu_commit || inputs.ksu_commit }}
        # SUSFS 原始补丁探测：apply.sh 是 build_kernel.sh 的 bash 子进程，
        # 这三个开关在这里给出才能一路透到 apply.sh；缺失的话 apply.sh 里
        # ${SUSFS_RAW_PROBE:-false} 恒为 false，探测会静默退化成常规构建。
        SUSFS_RAW_PROBE: ${{ inputs.susfs_raw_probe || false }}
        SUSFS_SIDE_FIXES: ${{ inputs.susfs_side_fixes || false }}
        SUSFS_PIN_TIME: ${{ inputs.susfs_pin_time || '' }}
        SUSFS_PROBE_DIR: ${{ github.workspace }}/susfs-probe
        # 用拆分步骤的结果而非原始入参：合并输入框里"逗号前一段"才是 SukiSU/管理器 hash。
        SUKISU_COMMIT: ${{ steps.resolve_commits.outputs.sukisu_commit }}
        KSU_BRANCH_MODE: ${{ inputs.ksu_branch_mode }}
        TOOLCHAIN_CACHE_HIT: ${{ steps.cache-toolchain.outputs.cache-hit }}
        WORKSPACE: ${{ github.workspace }}
    - name: 保存 Release 缓存（可选）
      if: ${{ inputs.use_release_cache && !cancelled() }}
      uses: ./.github/actions/cache-save
      with:
        cache_path: /home/runner/.ccache
        cache_key: ${{ github.ref_name }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}
        cache_bucket: ccache-cache
        github_token: ${{ secrets.GITHUB_TOKEN }}
        cache_sign_key: ${{ secrets.CACHE_SIGN_KEY }}
    - name: 上传编译失败日志
      # A-3：原为 always()，构建成功时也会上传 Build-Logs，
      # 而汇总 job 全量下载后把它当内核产物传上 Release。只在失败时上传。
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}${{ env.ARTIFACT_SUFFIX }}-Build-Logs
        path: build-logs/
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 9
    - name: 上传 SUSFS 集成补丁
      if: success() && env.SUSFS_PATCH_EXPORT == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: SUSFS-Patch-${{ inputs.ksu_variant }}-${{ env.CONFIG }}-${{ inputs.os_patch_level }}
        path: susfs-patch/
        if-no-files-found: warn
        compression-level: 9
    - name: 上传 AnyKernel3 刷入包
      # 新增「不上传」模式给 susfs-probe 用：原本这里是「非上传全部即上传」的兜底分支，
      # 若不同时排除 '不上传'，走任何其它值（包括新加的不上传）都会照传一份刷入包。
      if: inputs.artifact_upload_mode != '上传全部' && inputs.artifact_upload_mode != '不上传'
      uses: actions/upload-artifact@v6
      with:
        # A-1 闭环：stage_prepare_anykernel3 生成的 zip 落在 workspace 根（../$_zip），
        # 不在 AnyKernel3/ 目录内。上传「上传全部」分支已用 '*AnyKernel3.zip' 收集，
        # 此处必须一致，否则 zip 生成后被静默丢弃，用户仍拿不到可刷包。
        name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}${{ env.ARTIFACT_SUFFIX }}-AnyKernel3
        path: '*AnyKernel3.zip'
        if-no-files-found: warn
        compression-level: 9
    # 「上传全部」拆成两个产物：刷入包(~17MB)与启动镜像(~50MB)分开，
    # 避免下载一个 70MB 的压缩包只为拿 AnyKernel3.zip
    - name: 上传 AnyKernel3 刷入包
      if: inputs.artifact_upload_mode == '上传全部'
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}${{ env.ARTIFACT_SUFFIX }}-AnyKernel3
        path: '*AnyKernel3.zip'
        if-no-files-found: warn
        compression-level: 9
    - name: 上传启动镜像
      if: inputs.artifact_upload_mode == '上传全部'
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}${{ env.ARTIFACT_SUFFIX }}-Images
        path: '*.img'
        if-no-files-found: warn
        compression-level: 9
    - name: 上传补丁冲突文件
      if: always() && env.REJ_COUNT > 0
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}${{ env.ARTIFACT_SUFFIX }}-Rejects
        path: patch-rejects/
        if-no-files-found: ignore
        compression-level: 9
    - name: 发送 Telegram 通知
      if: ${{ inputs.send_telegram }}
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        ANDROID_VERSION: ${{ inputs.android_version }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
        SUB_LEVEL: ${{ inputs.sub_level }}
        OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        KSU_VARIANT: ${{ inputs.ksu_variant }}
        KSU_MODE: ${{ inputs.ksu_mode }}
        VERSION: ${{ inputs.version }}
        REVISION: ${{ inputs.revision }}
        BUILD_TIME: ${{ inputs.build_time }}
        USE_ZRAM: ${{ inputs.use_zram }}
        USE_BBG: ${{ inputs.use_bbg }}
        USE_KPM: ${{ inputs.use_kpm }}
        USE_REKERNEL: ${{ inputs.use_rekernel }}
        CVE_2026_43499_PATCH: ${{ inputs.cve_2026_43499_patch }}
        EXPORT_SUSFS_PATCHES: ${{ inputs.export_susfs_patches }}
        ENABLE_SUSFS: ${{ inputs.enable_susfs }}
        SUPP_OP: ${{ inputs.supp_op }}
        DROIDSPACES: ${{ inputs.droidspaces }}
        DROIDSPACES_NTSYNC: ${{ inputs.droidspaces_ntsync }}
        ARTIFACT_UPLOAD_MODE: ${{ inputs.artifact_upload_mode }}
        USE_BBR: ${{ inputs.use_bbr }}
        WORKSPACE: ${{ github.workspace }}
      run: python3 scripts/telegram_notify.py single || true
    # ==================== SUSFS 原始补丁探测结论 ====================
    # 无论编译成败都写出结论：原始补丁打不上本身就是本次探测要的结论，
    # 编译失败也要留下记录，否则汇总侧分不清是"没跑"还是"跑失败了"。
    - name: 写入 SUSFS 探测结果
      if: always() && inputs.susfs_raw_probe
      env:
        SUSFS_PROBE_DIR: ${{ github.workspace }}/susfs-probe
        ANDROID_VERSION: ${{ inputs.android_version }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
        SUB_LEVEL: ${{ inputs.sub_level }}
        OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        KSU_VARIANT: ${{ inputs.ksu_variant }}
        KERNEL_ROOT: ${{ github.workspace }}/${{ env.CONFIG }}
        SUSFS4KSU: ${{ github.workspace }}/susfs4ksu
        REJ_COUNT: ${{ env.REJ_COUNT }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python3 scripts/susfs_probe/write_result.py

    - name: 上传 SUSFS 探测结果
      if: always() && inputs.susfs_raw_probe
      uses: actions/upload-artifact@v6
      with:
        # susfs-probe.yml 用 pattern SUSFS-Probe-* 一次性收走全部任务的结论
        name: SUSFS-Probe-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-${{ inputs.ksu_variant }}
        path: susfs-probe/
        if-no-files-found: error
        retention-days: 30
        overwrite: true
        compression-level: 9