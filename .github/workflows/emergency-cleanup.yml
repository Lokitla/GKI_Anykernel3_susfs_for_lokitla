name: Emergency Release Cleanup

# 本工作流会 gh release edit / delete / create，必须显式声明 contents: write。
# 缺顶层 permissions 时只能依赖仓库默认 token 权限；默认设为只读则整条流程失败。
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      issue_type:
        description: '问题类型 (Issue Type)'
        required: true
        type: choice
        options:
          - Normal
          - Bug
          - Critical

      # ==================== 文本输入 ====================
      target_tag:
        description: '目标发布标签 (Target Release Tag)'
        required: true
        type: string
      reference:
        description: '问题链接或说明 (Issue link or description, optional)'
        required: false
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    # 仅允许仓库所有者执行
    if: github.actor == github.repository_owner

    # 安全：target_tag / reference 是自由文本输入，若用 ${{ }} 直接内插进 run 块，
    # 输入里一个引号就能截断命令、拼出任意 shell（Actions 注入）。
    # 一律经 env 传入，run 块里只用 "$VAR" 引用。与 build.yml 的做法保持一致。
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      TARGET_TAG: ${{ inputs.target_tag }}
      REFERENCE: ${{ inputs.reference }}
      ISSUE_TYPE: ${{ inputs.issue_type }}
      REPO: ${{ github.repository }}

    steps:
      # ==================== 验证发布是否存在 ====================
      - name: 验证 Release 存在
        run: |
          if ! gh release view "$TARGET_TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::Release '$TARGET_TAG' 不存在"
            exit 1
          fi
          echo "✅ 找到 Release: $TARGET_TAG"

      # ==================== 获取原始发布信息 ====================
      - name: 获取原始发布信息
        id: info
        run: |
          gh release view "$TARGET_TAG" --repo "$REPO" \
            --json name,body,isPrerelease > release_info.json

          jq -r '.name' release_info.json > original_title.txt
          jq -r '.body' release_info.json > original_body.txt

          IS_PRERELEASE=$(jq -r '.isPrerelease' release_info.json)
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          echo "📋 原标题: $(cat original_title.txt)"
          echo "📋 Pre-release: $IS_PRERELEASE"

      # ==================== 处理 Normal 类型 ====================
      - name: 处理 Normal 类型 - 标记正常
        if: inputs.issue_type == 'Normal'
        run: |
          cat > new_body.md << 'EOF'
          > [!TIP]
          > **此版本已验证，可正常使用。**
          >
          > **This release has been verified and is safe to use.**
          EOF

          sed -i 's/^          //' new_body.md

          if [ -n "$REFERENCE" ]; then
            echo "" >> new_body.md
            echo "**参考 / Reference**: $REFERENCE" >> new_body.md
          fi

          echo "" >> new_body.md
          echo "---" >> new_body.md
          echo "" >> new_body.md
          cat original_body.txt >> new_body.md

          gh release edit "$TARGET_TAG" --repo "$REPO" \
            --notes-file new_body.md

          echo "✅ 已标记 Release 为正常 (Normal)"

      # ==================== 处理 Bug 类型 ====================
      - name: 处理 Bug 类型
        if: inputs.issue_type == 'Bug'
        run: |
          cat > new_body.md << 'EOF'
          > [!WARNING]
          > **此版本存在已知 Bug，建议谨慎使用。**
          >
          > **This release contains known bugs, use with caution.**
          EOF

          sed -i 's/^          //' new_body.md

          if [ -n "$REFERENCE" ]; then
            echo "" >> new_body.md
            echo "**参考 / Reference**: $REFERENCE" >> new_body.md
          fi

          echo "" >> new_body.md
          echo "---" >> new_body.md
          echo "" >> new_body.md
          cat original_body.txt >> new_body.md

          gh release edit "$TARGET_TAG" --repo "$REPO" \
            --notes-file new_body.md

          echo "✅ 已更新 Release 说明 (Bug)"

      # ==================== 处理 Critical 类型 ====================
      - name: 处理 Critical 类型 - 删除并重建
        if: inputs.issue_type == 'Critical'
        run: |
          ORIGINAL_TITLE=$(cat original_title.txt)

          # 构建警告信息
          cat > new_body.md << 'EOF'
          > [!CAUTION]
          > **本次发布的资源包含导致死机的严重 Bug，所有附件已被清除！**
          >
          > **请勿使用此版本，等待修复版本发布。**
          >
          > **This release contained a critical bug causing device crashes. All assets have been removed!**
          >
          > **DO NOT use this version. Please wait for a fixed release.**
          EOF

          sed -i 's/^          //' new_body.md

          if [ -n "$REFERENCE" ]; then
            echo "" >> new_body.md
            echo "**参考 / Reference**: $REFERENCE" >> new_body.md
          fi

          echo "" >> new_body.md
          echo "---" >> new_body.md
          echo "" >> new_body.md
          cat original_body.txt >> new_body.md

          # 删除 Release（保留 Git Tag）
          echo "🗑️ 删除原 Release..."
          gh release delete "$TARGET_TAG" --repo "$REPO" --yes

          # 确定 prerelease 标志
          PRERELEASE_FLAG=""
          if [ "${{ steps.info.outputs.is_prerelease }}" == "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # 重建 Release（不上传任何文件）
          echo "🔄 重建 Release..."
          gh release create "$TARGET_TAG" --repo "$REPO" \
            --title "$ORIGINAL_TITLE" \
            --notes-file new_body.md \
            $PRERELEASE_FLAG

          echo "✅ 已清除所有附件并重建 Release (Critical)"

      # ==================== 完成通知 ====================
      - name: 完成
        run: |
          echo "=========================================="
          echo "🎯 目标标签: $TARGET_TAG"
          echo "📌 问题类型: $ISSUE_TYPE"
          echo "📝 参考信息: ${REFERENCE:-无}"
          echo "=========================================="
          echo "✅ 紧急清理完成！"
