      # ==================== 生成版本标签 ====================
      # tag 形如 <SUSFS版本>-r<N>-<变体>。
      # 变体后缀是必须的：BakaSU 与 SukiSU 各有独立的定时检测工作流，两路若共用
      # 同一套 -rN 序列，后发那次会算出已存在的 tag，gh release create 失败、
      # 该次全部产物静默丢失。所以按变体各自计数。
      - name: 生成版本标签
        run: |
          # 获取 SUSFS 版本，如果 get-manager 被跳过则使用默认值
          SUS_VERSION="${{ needs.get-manager.outputs.susVer }}"
          if [ -z "$SUS_VERSION" ]; then
            echo "警告: 未获取到 SUSFS 版本，使用默认版本号"
            SUS_VERSION="1.0.0"
          fi

          # 括号在 tag 名里虽可用，但命令行与 URL 里都不便，统一去掉
          VARIANT="${{ inputs.kernelsu_variant }}"
          VARIANT_SLUG=$(printf '%s' "$VARIANT" | tr -d '() ')

          # 只在同一变体内递增。
          # 不能像以前那样取 tags 列表的 [0]：两个变体交叉发布时 [0] 常常是另一个
          # 变体的 tag，"版本相同则递进"那个判断会落到备分支、计数从头再来。
          # --paginate 是必要的：单页只有 100 个 tag，交叉发布下窗口不够。
          # pipeline 末尾的 || true 不可省：gh 调用失败或 grep 无匹配时，
          # 在 Actions 的 bash -e -o pipefail 下会让整个步骤失败。
          LATEST_N=$(gh api --paginate "repos/$REPO_OWNER/$REPO_NAME/tags?per_page=100" --jq -r '.[].name' 2>/dev/null \
            | grep -E "^${SUS_VERSION}-r[0-9]+-${VARIANT_SLUG}$" \
            | sed -E "s/^${SUS_VERSION}-r([0-9]+)-${VARIANT_SLUG}$/\1/" \
            | sort -n | tail -1 || true)

          if [ -z "$LATEST_N" ]; then
            LATEST_N=0
            echo "该变体此前没有 <$SUS_VERSION> 的发布，从 -r1 起算"
          fi
          NEW_TAG="${SUS_VERSION}-r$((LATEST_N + 1))-${VARIANT_SLUG}"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "生成标签: $NEW_TAG（变体 $VARIANT，上一版 -r${LATEST_N}）"

      # ==================== 下载构建产物 ====================
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts

      # ==================== 创建 GitHub Release ====================
      - name: 创建 GitHub Release
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$NEW_TAG" \
            --title "$RELEASE_NAME" \
            --notes-file release_body.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG

      # ==================== 上传管理器和模块 ====================
      - name: 上传管理器和 SUSFS 模块
        continue-on-error: true
        run: |
          echo "准备上传 APK 与 SUSFS 模块..."
          apk_count=$(find ./downloaded-artifacts -type f -name "*.apk" | wc -l || true)
          sus_count=$(find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" | wc -l || true)
          echo "APK files: ${apk_count}"
          echo "SUSFS files: ${sus_count}"
          find ./downloaded-artifacts -type f -name "*.apk" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" --clobber || true
          done
          find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" --clobber || true
          done

      # ==================== 上传 SUSFS 集成补丁 ====================
      # 汇总 job 被跳过或没有产物时静默跳过
      - name: 上传 SUSFS 集成补丁
        if: needs.collect-susfs-patches.result == 'success'
        continue-on-error: true
        run: |
          uploaded=0
          for file in ./downloaded-artifacts/SUSFS-Patches-*/SUSFS-Patches-*.zip; do
            [ -f "$file" ] || continue
            echo "上传 $file..."
            gh release upload "$NEW_TAG" "$file" --clobber && uploaded=$((uploaded + 1))
          done
          echo "已上传 $uploaded 个 SUSFS 集成补丁压缩包"

      # ==================== 上传内核产物 ====================
      - name: 上传内核产物
        run: |
          for file in ./downloaded-artifacts/*_kernel-*/*; do
            [ -d "$file" ] && continue
            # 跳过 -Rejects 目录中的文件（已在 collect-rejects 中汇总处理）
            [[ "$file" == *-Rejects/* ]] && continue
            # Build-Logs 是失败诊断用的日志，不是可刷写产物，不能进 Release
            [[ "$file" == *-Build-Logs/* ]] && continue
            echo "上传 $file..."
            # B-2：同名资产已存在时必须 --clobber，否则重跑发布会静默漏掉产物
            gh release upload "$NEW_TAG" "$file" --clobber
          done

      # ==================== 构建摘要 ====================
      - name: 构建摘要
        run: |
          echo "## 发布已创建" >> $GITHUB_STEP_SUMMARY
          echo "- **标签**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **类型**: ${{ inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **链接**: https://github.com/$REPO_OWNER/$REPO_NAME/releases/tag/$NEW_TAG" >> $GITHUB_STEP_SUMMARY

