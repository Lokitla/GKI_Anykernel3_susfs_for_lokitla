# ========================================
# GKI 内核构建主入口
# ========================================
# 此工作流是项目的统一入口点，用于：
# 1. 构建所有版本的 GKI 内核
# 2. 获取最新的 KSU 管理器
# 3. 收集补丁冲突文件和编译失败日志用于调试
# 4. 创建 GitHub Release (可选)
# ========================================

name: 构建内核

# 并发控制：同一分支只运行一个实例，新运行会取消旧的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      release_type:
        description: "发布类型"
        type: choice
        options:
          - Release
          - Pre-Release
          - Actions
        default: Release
      kernelsu_variant:
        description: "KernelSU 变体"
        type: choice
        options:
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
          - FinaSU
          - Official
          # Next 变体已在 build.py 与 kernel-custom.yml 支持（build.py:32 / kernel-custom.yml:27-32），
          # 但 main.yml 手动入口未启用：其 workflow_dispatch 的 input 名额有限，
          # 且默认 BakaSU 是发布通道，混入 Next（独立分支、无 config KPM）易误导用户。
          # 需要 Next 请走「内核构建 - Android 1x (自定义)」入口或本地 build.py。
          #- Next
        default: BakaSU
      enable_susfs:
        description: "集成 SUSFS"
        required: false
        type: boolean
        default: true
      use_kpm:
        description: "KPM 模块支持（编译后修补 Image。6.12 及以上不支持：SukiSU 的 KPM 代码用了新内核已移除的 netlink_kernel_cfg.cb_mutex；6.6 是支持的）"
        type: choice
        default: "patched (开启并修补)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补)"
      droidspaces:
        description: "Droidspaces 容器支持"
        type: choice
        options:
          - "不启用"
          - "678"
          - "123"
          - "345"
        default: "不启用"

      # ==================== 文本输入 ====================
      version:
        description: "自定义版本名 (可选)"
        type: string
        default: ""
        required: false
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        type: string
        default: "Thu Sep 17 00:00:00 UTC 2026"
        required: false

      # ==================== 开关（默认开启） ====================
      build_all:
        description: "构建全部版本"
        type: boolean
        default: true
      export_susfs_patches:
        description: "收集 SUSFS 集成补丁（SukiSU / BakaSU / FinaSU）"
        type: boolean
        default: true

      # ==================== 构建目标 ====================
      # 用逗号分隔的目标列表控制各 Android 版本，减少 workflow_dispatch 输入项。
      # 写法：a12 / a13 / a14 / a15 / a16，或 all（全部，含 6.12）。
      # 例：a12,a15    只构建 5.10 与 6.6
      #     all        全部五个（等价于旧的 build_all=true）
      build_targets:
        description: "构建目标，逗号分隔（a12/a13/a14/a15/a16）或 all"
        type: string
        default: "all"
        required: false

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        type: boolean
        default: true
      use_bbg:
        description: "启用 BBG 基带保护（防止基带分区被擦除）"
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 NTSync 支持（需先启用 Droidspaces）"
        type: boolean
        default: false

      # 原 use_bbr 的input 名额改为 use_net_enhance：
      # 网络增强本身就包含「把 BBR 设为默认拥塞算法」（build_kernel.sh 的
      # stage_config_net_enhance 会写 CONFIG_DEFAULT_BBR=y），两个开关只会造成歧义。
      # 这样既统一了语义，又没有额外占用 25 个名额里的位置。
      use_net_enhance:
        description: "启用网络增强（IPSet 全类型 + BBR + FQ/FQ_CODEL 队列 + IPv6 NAT + 附加拥塞算法）"
        required: false
        type: boolean
        default: false
      send_telegram:
        description: "发送 Telegram 通知（需配置 secrets）"
        required: false
        type: boolean
        default: true
      # 一加 8E 支持开关仅适用于对应设备。
      supp_op:
        description: "启用一加 8E 支持（非一加设备勿开）"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      use_release_cache:
        description: "用 GitHub Release 存储 ccache"
        required: false
        type: boolean
        default: false
      # ksu_mode 已从手动触发界面隐藏：本仓库的存在前提就是集成 KernelSU，
      # 不存在"不集成 KSU"的常规用法。功能代码未删除——build.yml 的
      # workflow_call 仍保留该输入，需要时取消下面注释并恢复 with: 透传即可。
#       ksu_mode:
#         description: "KernelSU 模式：关闭=正常集成 KernelSU / 禁用KSU=不集成任何 KernelSU 代码（SUSFS 的启停由 enable_susfs 独立控制，不要写在这里）"
#         required: false
#         type: choice
#         options:
#           - "关闭"
#           - "禁用KSU"
#         default: "关闭"
      # 注：ksu_branch_mode 已从手动触发界面移除 —— workflow_dispatch 上限 25 个 input，
      # 自动触发（Auto_Trigger）已占满 24 个必需字段，手动专用项只能留一个（保留 version）。
      # 其转发处用 ${{ inputs.ksu_branch_mode || 'auto' }} 兜底，不声明时自然回退 auto。
      manager_commit:
        description: "提交 hash（合并输入框）：<管理器&内核KSU>,<SUSFS>，逗号或竖线分隔均可，0 = 该段不指定。例：0,def456...(只锁 SUSFS) / abc123...,0(只锁管理器与内核)；留空则不锁定。FinaSU 始终对齐官方 Release"
        required: false
        type: string
        default: ""
jobs:
  # ==================== 获取管理器 ====================
  # 下载最新的 KernelSU 管理器 APK 和 SUSFS 模块
  get-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      manager_commit: ${{ inputs.manager_commit }}
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}
      manager_spoofed: true
  # ==================== Android 12 - 5.10 构建 ====================
  build-a12-5-10:
    needs: get-manager
    if: contains(inputs.build_targets, 'a12') || contains(inputs.build_targets, 'all')
    uses: ./.github/workflows/kernel-a12-5-10.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      enable_susfs: ${{ inputs.enable_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "上传全部"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true
      send_telegram: ${{ inputs.send_telegram || false }}
      use_release_cache: ${{ inputs.use_release_cache || false }}
      supp_op: ${{ inputs.supp_op || false }}
      manager_commit: ${{ inputs.manager_commit }}
      # ksu_mode 不传：build.yml 默认「关闭」（正常集成 KernelSU）。
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}
      # 内核对齐：KernelSU 检出到所选 Manager 构建同一提交（BakaSU / FinaSU 生效）
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      # 以下两项目前仍未在手动界面暴露（25 个 input 名额已用满）：
      #   skip_incompatible —— 可选阶段失败时降级为 warning 而非中断
      #   ksu_branch_mode   —— 上方已注明，不声明时自然回退 auto
      # 而 use_net_enhance / susfs_commit 已随本次名额整理改为可调（见 input 定义）。
      use_net_enhance: ${{ inputs.use_net_enhance || false }}
      skip_incompatible: false
  # ==================== Android 13 - 5.15 构建 ====================
  build-a13-5-15:
    needs: get-manager
    if: contains(inputs.build_targets, 'a13') || contains(inputs.build_targets, 'all')
    uses: ./.github/workflows/kernel-a13-5-15.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      enable_susfs: ${{ inputs.enable_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "上传全部"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true
      send_telegram: ${{ inputs.send_telegram || false }}
      use_release_cache: ${{ inputs.use_release_cache || false }}
      supp_op: ${{ inputs.supp_op || false }}
      manager_commit: ${{ inputs.manager_commit }}
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}
      # 内核对齐：KernelSU 检出到所选 Manager 构建同一提交（BakaSU / FinaSU 生效）
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      # 以下两项目前仍未在手动界面暴露（25 个 input 名额已用满）：
      #   skip_incompatible —— 可选阶段失败时降级为 warning 而非中断
      #   ksu_branch_mode   —— 上方已注明，不声明时自然回退 auto
      # 而 use_net_enhance / susfs_commit 已随本次名额整理改为可调（见 input 定义）。
      use_net_enhance: ${{ inputs.use_net_enhance || false }}
      skip_incompatible: false
  # ==================== Android 14 - 6.1 构建 ====================
  build-a14-6-1:
    needs: get-manager
    if: contains(inputs.build_targets, 'a14') || contains(inputs.build_targets, 'all')
    uses: ./.github/workflows/kernel-a14-6-1.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      enable_susfs: ${{ inputs.enable_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "上传全部"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true
      send_telegram: ${{ inputs.send_telegram || false }}
      use_release_cache: ${{ inputs.use_release_cache || false }}
      supp_op: ${{ inputs.supp_op || false }}
      manager_commit: ${{ inputs.manager_commit }}
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}
      # 内核对齐：KernelSU 检出到所选 Manager 构建同一提交（BakaSU / FinaSU 生效）
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      # 以下两项目前仍未在手动界面暴露（25 个 input 名额已用满）：
      #   skip_incompatible —— 可选阶段失败时降级为 warning 而非中断
      #   ksu_branch_mode   —— 上方已注明，不声明时自然回退 auto
      # 而 use_net_enhance / susfs_commit 已随本次名额整理改为可调（见 input 定义）。
      use_net_enhance: ${{ inputs.use_net_enhance || false }}
      skip_incompatible: false
  # ==================== Android 15 - 6.6 构建 ====================
  build-a15-6-6:
    needs: get-manager
    if: contains(inputs.build_targets, 'a15') || contains(inputs.build_targets, 'all')
    uses: ./.github/workflows/kernel-a15-6-6.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      enable_susfs: ${{ inputs.enable_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "上传全部"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true
      send_telegram: ${{ inputs.send_telegram || false }}
      use_release_cache: ${{ inputs.use_release_cache || false }}
      supp_op: ${{ inputs.supp_op || false }}
      manager_commit: ${{ inputs.manager_commit }}
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}
      # 内核对齐：KernelSU 检出到所选 Manager 构建同一提交（BakaSU / FinaSU 生效）
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      # 以下两项目前仍未在手动界面暴露（25 个 input 名额已用满）：
      #   skip_incompatible —— 可选阶段失败时降级为 warning 而非中断
      #   ksu_branch_mode   —— 上方已注明，不声明时自然回退 auto
      # 而 use_net_enhance / susfs_commit 已随本次名额整理改为可调（见 input 定义）。
      use_net_enhance: ${{ inputs.use_net_enhance || false }}
      skip_incompatible: false
  # ==================== Android 16 - 6.12 构建 ====================
  build-a16-6-12:
    needs: get-manager
    if: contains(inputs.build_targets, 'a16') || contains(inputs.build_targets, 'all')
    uses: ./.github/workflows/kernel-a16-6-12.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      enable_susfs: ${{ inputs.enable_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "上传全部"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true
      send_telegram: ${{ inputs.send_telegram || false }}
      use_release_cache: ${{ inputs.use_release_cache || false }}
      supp_op: ${{ inputs.supp_op || false }}
      manager_commit: ${{ inputs.manager_commit }}
      ksu_branch_mode: ${{ inputs.ksu_branch_mode || 'auto' }}
      # 内核对齐：KernelSU 检出到所选 Manager 构建同一提交（BakaSU / FinaSU 生效）
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      # 以下两项目前仍未在手动界面暴露（25 个 input 名额已用满）：
      #   skip_incompatible —— 可选阶段失败时降级为 warning 而非中断
      #   ksu_branch_mode   —— 上方已注明，不声明时自然回退 auto
      # 而 use_net_enhance / susfs_commit 已随本次名额整理改为可调（见 input 定义）。
      use_net_enhance: ${{ inputs.use_net_enhance || false }}
      skip_incompatible: false
  # ==================== 收集补丁冲突文件 ====================
  # 汇总所有构建任务中的 .rej 文件，方便调试补丁问题
  collect-rejects:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: 下载冲突文件
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          pattern: '*-Rejects'

      - name: 处理冲突文件
        run: |
          mkdir -p aio-rejects
          for dir in ./downloaded-artifacts/*-Rejects; do
            [ -d "$dir" ] || continue
            dirname=$(basename "$dir")
            original_name=${dirname%-Rejects}
            mkdir -p "aio-rejects/$original_name"
            cp -r "$dir/." "aio-rejects/$original_name/"
          done
          if [ "$(ls -A aio-rejects 2>/dev/null)" ]; then
            cd aio-rejects && zip -r -q -9 ../AIO-REJ.zip . && cd ..
          fi

      - name: 上传汇总冲突文件
        uses: actions/upload-artifact@v6
        with:
          name: AIO-REJ
          path: AIO-REJ.zip
          if-no-files-found: ignore

  # ==================== 收集编译失败日志 ====================
  # 按构建名称汇总所有失败日志，方便统一下载和定位问题
  collect-build-logs:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: 下载编译失败日志
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-build-logs
          pattern: '*-Build-Logs'
          merge-multiple: false

      - name: 处理编译失败日志
        run: |
          mkdir -p aio-build-logs
          found_logs=false
          for dir in ./downloaded-build-logs/*-Build-Logs; do
            [ -d "$dir" ] || continue
            artifact_name=$(basename "$dir")
            mkdir -p "aio-build-logs/$artifact_name"
            cp -r "$dir/." "aio-build-logs/$artifact_name/"
            found_logs=true
          done

          # download-artifact 仅匹配一个产物时会直接解压到目标目录
          if [ "$found_logs" = false ] && [ -f ./downloaded-build-logs/artifact-name.txt ]; then
            read -r artifact_name < ./downloaded-build-logs/artifact-name.txt
            artifact_name=$(basename "$artifact_name")
            if [ -n "$artifact_name" ]; then
              mkdir -p "aio-build-logs/$artifact_name"
              cp -r ./downloaded-build-logs/. "aio-build-logs/$artifact_name/"
            fi
          fi

          if [ "$(ls -A aio-build-logs 2>/dev/null)" ]; then
            cd aio-build-logs
            zip -r -q -9 ../AIO-BUILD-LOGS.zip .
          fi

      - name: 上传汇总编译失败日志
        id: upload_aggregated_build_logs
        uses: actions/upload-artifact@v6
        with:
          name: AIO-BUILD-LOGS
          path: AIO-BUILD-LOGS.zip
          if-no-files-found: ignore

      - name: 删除独立编译失败日志
        if: steps.upload_aggregated_build_logs.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 汇总产物上传成功后删除中间产物，避免重复占用空间
          if ! ARTIFACT_IDS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | endswith("-Build-Logs")) | .id'); then
            echo "::warning::获取独立编译失败日志列表失败，跳过清理"
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            if gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > /dev/null; then
              echo "已删除中间日志产物: $artifact_id"
            else
              echo "::warning::删除中间日志产物 $artifact_id 失败"
            fi
          done <<< "$ARTIFACT_IDS"

  # ==================== 收集 SUSFS 集成补丁 ====================
  # 汇总各构建任务导出的 SUSFS 集成补丁，打成一个 zip 供 Release 分发
  # SukiSU / BakaSU / FinaSU 且启用 SUSFS 时有产物
  collect-susfs-patches:
    if: ${{ !cancelled() && inputs.export_susfs_patches && inputs.enable_susfs && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'BakaSU' || inputs.kernelsu_variant == 'FinaSU') }}
    runs-on: ubuntu-24.04
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: 下载 SUSFS 集成补丁
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-susfs-patches
          pattern: 'SUSFS-Patch-*'
          merge-multiple: false

      - name: 整理 SUSFS 集成补丁
        env:
          KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        run: |
          BUNDLE="susfs-patches"
          mkdir -p "$BUNDLE"
          found=0

          # 按 manifest 中的字段归档：android14-6.1/6.1.148-2025-12/
          place_patch() {
            local src="$1" manifest="$src/manifest.json"
            if [ ! -f "$manifest" ] || [ ! -s "$src/susfs.patch" ]; then
              echo "::warning::$src 缺少 manifest.json 或 susfs.patch，跳过"
              return 0
            fi
            local android_version kernel_version actual_sublevel os_patch_level
            android_version=$(jq -r '.android_version' "$manifest")
            kernel_version=$(jq -r '.kernel_version' "$manifest")
            actual_sublevel=$(jq -r '.actual_sublevel' "$manifest")
            os_patch_level=$(jq -r '.os_patch_level' "$manifest")
            local dest="$BUNDLE/${android_version}-${kernel_version}/${kernel_version}.${actual_sublevel}-${os_patch_level}"
            mkdir -p "$dest"
            cp "$src/susfs.patch" "$src/manifest.json" "$dest/"
            [ -f "$src/susfs.config" ] && cp "$src/susfs.config" "$dest/"
            found=$((found + 1))
          }

          for dir in ./downloaded-susfs-patches/SUSFS-Patch-*; do
            [ -d "$dir" ] || continue
            place_patch "$dir"
          done
          # download-artifact 仅匹配一个产物时会直接解压到目标目录
          if [ "$found" -eq 0 ] && [ -f ./downloaded-susfs-patches/manifest.json ]; then
            place_patch ./downloaded-susfs-patches
          fi

          if [ "$found" -eq 0 ]; then
            echo "::warning::没有可汇总的 SUSFS 集成补丁"
            exit 0
          fi
          echo "共汇总 $found 份补丁"

          # 顶层索引：合并全部 manifest，按内核版本排序
          find "$BUNDLE" -name manifest.json -print0 | sort -z | xargs -0 jq -s \
            --arg ksu_variant "$KSU_VARIANT" \
            --arg generated_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              ksu_variant: $ksu_variant,
              generated_at: $generated_at,
              run_id: $run_id,
              run_url: $run_url,
              count: length,
              patches: (map(. + {
                path: ("\(.android_version)-\(.kernel_version)/\(.kernel_version).\(.actual_sublevel)-\(.os_patch_level)/")
              }) | sort_by(.android_version, (.actual_sublevel | tonumber)))
            }' > "$BUNDLE/index.json"

          cat > "$BUNDLE/README.md" << 'EOF'
          # SUSFS 集成补丁

          本压缩包由 GKI_KernelSU_SUSFS 的构建流程自动导出，每个目录对应一个 GKI 分支，
          内容是「添加 KernelSU 之后、应用 SUSFS 补丁之后」两个时间点之间 `common/` 的全部差异，
          已包含该分支所需的上下文修复，且对应内核已编译通过。

          目录结构：`<android版本>-<内核版本>/<内核版本>.<子版本>-<安全补丁级别>/`

          | 文件 | 说明 |
          |:---|:---|
          | `susfs.patch` | SUSFS 内核侧补丁（`git diff --binary` 格式） |
          | `susfs.config` | 需追加到 defconfig 的 SUSFS 配置片段 |
          | `manifest.json` | 生成信息：GKI 分支与提交、KernelSU 提交、SUSFS 提交、.rej 数量等 |
          | `index.json` | 顶层索引，汇总全部 manifest |

          ## 使用步骤

          1. 确认内核源码 `Makefile` 中的 `VERSION`、`PATCHLEVEL`、`SUBLEVEL` 与目录名一致，
             不一致时可先尝试最接近的子版本。
          2. 在内核源码上级目录（`common/` 的父目录）执行 `manifest.json` 中的 `ksu_setup_cmd`，
             按记录的提交哈希添加 KernelSU。补丁内容与该 KernelSU 提交配套，请勿改用其他分支。
          3. 进入 `common/` 应用补丁：

             ```bash
             git apply -3 /path/to/susfs.patch
             # 源码不是 git 仓库时退回：
             patch -p1 < /path/to/susfs.patch
             ```

          4. 把 `susfs.config` 追加到 defconfig（GKI 为 `arch/arm64/configs/gki_defconfig`）：

             ```bash
             cat /path/to/susfs.config >> arch/arm64/configs/gki_defconfig
             ```

          5. 按 KernelSU 文档启用 `CONFIG_KSU` 等选项后正常编译。

          ## 注意

          - 补丁在纯 GKI 源码上验证通过。基于 GKI 的 OEM 内核可能因 fs/、security/ 等目录被修改而出现 `.rej`，
            需要手动合并。`git apply -3` 的三方合并可自动解决大部分上下文偏移。
          - 固定 KernelSU 提交时，KernelSU 自身的版本号和版本串由其 Kbuild 在编译时计算，可能显示为分支最新计数或 `@HEAD`，属上游行为。
          - 使用与 `manifest.json` 中 `ksu_commit` 不同的 KernelSU 提交通常仍可编译，但不保证功能完整。
          EOF

          cd "$BUNDLE"
          zip -r -q -9 "../SUSFS-Patches-${KSU_VARIANT}.zip" .
          cd ..
          echo "SUSFS_PATCHES_ZIP=SUSFS-Patches-${KSU_VARIANT}.zip" >> $GITHUB_ENV

      - name: 上传汇总 SUSFS 集成补丁
        id: upload_aggregated_susfs_patches
        if: env.SUSFS_PATCHES_ZIP != ''
        uses: actions/upload-artifact@v6
        with:
          name: SUSFS-Patches-${{ inputs.kernelsu_variant }}
          path: ${{ env.SUSFS_PATCHES_ZIP }}
          if-no-files-found: ignore

      - name: 删除独立 SUSFS 补丁产物
        if: steps.upload_aggregated_susfs_patches.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 汇总产物上传成功后删除中间产物，避免重复占用空间
          if ! ARTIFACT_IDS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("SUSFS-Patch-")) | .id'); then
            echo "::warning::获取独立 SUSFS 补丁产物列表失败，跳过清理"
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            if gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > /dev/null; then
              echo "已删除中间补丁产物: $artifact_id"
            else
              echo "::warning::删除中间补丁产物 $artifact_id 失败"
            fi
          done <<< "$ARTIFACT_IDS"

  # ==================== 创建发布 ====================
  # 当 release_type 不是 Actions 时，创建 GitHub Release
  # 仅限原仓库运行，fork 仓库跳过此步骤
  release:
    # 原条件硬编码 upstream 仓库，导致 fork 后永远不发布 Release；
    # 现在只保留“发布类型 != Actions”这一个判断，任何 fork 都能按选择发布。
    if: ${{ always() && !cancelled() && inputs.release_type != 'Actions' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    needs:
      - get-manager
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
      - collect-susfs-patches

    # ==================== 环境变量 ====================
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      # GITHUB_TOKEN 在部分仓库被限制创建 Release（403 Resource not accessible
      # by integration），配置了 RELEASE_TOKEN 时优先使用专用 PAT。
      GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      # ==================== 设置显示名称 ====================
      # 预计算各种显示名称，简化后续引用
      - name: 设置显示名称
        run: |
          # KSU 显示名称
          case "${{ inputs.kernelsu_variant }}" in
            "Next")      KSU_NAME="KernelSU-Next" ;;
            "Official")  KSU_NAME="KernelSU" ;;
            "SukiSU"|"SukiSU(40726)"|"SukiSU(40548)") KSU_NAME="SukiSU" ;;
            "BakaSU")  KSU_NAME="BakaSU" ;;
            "FinaSU")  KSU_NAME="FinaSU" ;;
          esac
          echo "KSU_NAME=$KSU_NAME" >> $GITHUB_ENV

          # 版本信息
          KSU_VER="${{ needs.get-manager.outputs.ksuVer }}"
          SUS_VER="${{ needs.get-manager.outputs.susVer }}"
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV
          echo "SUS_VER=$SUS_VER" >> $GITHUB_ENV

          # 功能开关显示
          echo "LZ4_STATUS=${{ inputs.use_zram && '开启' || '未开启' }}" >> $GITHUB_ENV
          echo "BBG_STATUS=${{ inputs.use_bbg && '支持' || '不支持' }}" >> $GITHUB_ENV
          # KPM 只有 SukiSU 变体提供。BakaSU / Official / Next 的内核 Kconfig 里
          # 没有 config KPM，构建脚本会把 KPM 阶段整段跳过，这里如实反映——
          # 否则 Release 列表会挂着「支持（已修补镜像）」，实际却加载不了 KPM 模块。
          if [[ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]] \
             || [[ "${{ inputs.kernelsu_variant }}" == "Official" ]] \
             || [[ "${{ inputs.kernelsu_variant }}" == "Next" ]] \
             || [[ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]]; then
            echo "KPM_STATUS=不支持（变体未提供 KPM）" >> $GITHUB_ENV
          elif [[ "${{ inputs.use_kpm }}" == enabled* ]]; then
            echo "KPM_STATUS=支持" >> $GITHUB_ENV
          elif [[ "${{ inputs.use_kpm }}" == patched* ]]; then
            echo "KPM_STATUS=支持（已修补镜像）" >> $GITHUB_ENV
          else
            echo "KPM_STATUS=未开启" >> $GITHUB_ENV
          fi

          # Hook 类型
          if [ "${{ inputs.kernelsu_variant }}" = "FinaSU" ]; then
            if [ "${{ inputs.enable_susfs }}" = "true" ]; then
              echo "HOOK_TYPE=SUSFS Manual Hooks" >> $GITHUB_ENV
            else
              echo "HOOK_TYPE=Inline Syscall Hooks" >> $GITHUB_ENV
            fi
          elif [ "${{ inputs.kernelsu_variant }}" = "SukiSU" ] || [ "${{ inputs.kernelsu_variant }}" = "SukiSU(40726)" ] || [ "${{ inputs.kernelsu_variant }}" = "SukiSU(40548)" ] || [ "${{ inputs.kernelsu_variant }}" = "BakaSU" ]; then
            echo "HOOK_TYPE=SUSFS Inline Hooks" >> $GITHUB_ENV
          else
            echo "HOOK_TYPE=KPROBE Hooks" >> $GITHUB_ENV
          fi

          # Mount 类型
          if [ "${{ inputs.kernelsu_variant }}" = "Official" ]; then
            echo "MOUNT_TYPE=OVERLAYFS" >> $GITHUB_ENV
          else
            echo "MOUNT_TYPE=Magic Mount" >> $GITHUB_ENV
          fi

          # 发布标题与 KernelSU / SUSFS 模式（GITHUB_ENV 中后写入的同名变量会覆盖前面的值）
          # 三态选择已简化为「是否集成 SUSFS」，纯净 GKI 不再提供
          if [[ "${{ inputs.enable_susfs }}" != "true" ]]; then
            echo "SUS_VER=未集成" >> $GITHUB_ENV
            echo "RELEASE_HEADLINE=**${KSU_NAME} ${KSU_VER}**（未集成 SUSFS）" >> $GITHUB_ENV
            echo "RELEASE_NAME=GKI Kernel: ${KSU_NAME} ${KSU_VER}（无 SUSFS）" >> $GITHUB_ENV
          else
            echo "RELEASE_HEADLINE=**${KSU_NAME} ${KSU_VER}** + **SUSFS ${SUS_VER}**" >> $GITHUB_ENV
            echo "RELEASE_NAME=GKI Kernel: ${KSU_NAME} ${KSU_VER} + SUSFS ${SUS_VER}" >> $GITHUB_ENV
          fi

      # ==================== 验证构建状态 ====================
      # 确保所有选中的构建任务都成功完成
      - name: 验证构建状态
        run: |
          failed=0
          check_build() {
            local selected="$1" job_name="$2" result="$3"
            if [[ "$selected" == "true" && "$result" != "success" && "$result" != "skipped" ]]; then
              echo "选中的构建任务 $job_name 失败 (结果: $result)"
              failed=1
            fi
          }
          check_build "${{ contains(inputs.build_targets, 'a12') || contains(inputs.build_targets, 'all') }}" "build-a12-5-10" "${{ needs.build-a12-5-10.result }}"
          check_build "${{ contains(inputs.build_targets, 'a13') || contains(inputs.build_targets, 'all') }}" "build-a13-5-15" "${{ needs.build-a13-5-15.result }}"
          check_build "${{ contains(inputs.build_targets, 'a14') || contains(inputs.build_targets, 'all') }}" "build-a14-6-1" "${{ needs.build-a14-6-1.result }}"
          check_build "${{ contains(inputs.build_targets, 'a15') || contains(inputs.build_targets, 'all') }}" "build-a15-6-6" "${{ needs.build-a15-6-6.result }}"
          check_build "${{ contains(inputs.build_targets, 'a16') || contains(inputs.build_targets, 'all') }}" "build-a16-6-12" "${{ needs.build-a16-6-12.result }}"
          [[ "$failed" -ne 0 ]] && exit 1 || true

      # ==================== 检出代码 ====================
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # ==================== 确定 KSU 引用 ====================
      # 根据实际构建逻辑确定 KernelSU 上游引用
      - name: 确定 KSU 引用
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "Official") BRANCH="main" ;;
            "SukiSU"|"SukiSU(40726)"|"SukiSU(40548)")
              if [ "${{ inputs.enable_susfs }}" != "true" ]; then
                BRANCH="main"
              else
                BRANCH="builtin"
              fi
              ;;
            "BakaSU") BRANCH="main" ;;
            "FinaSU") BRANCH="master" ;;
            "Next") BRANCH="dev" ;;
            *) echo "错误: 未知变体" >&2; exit 1 ;;
          esac
          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "BRANCH_INFO=$BRANCH" >> $GITHUB_ENV

      # ==================== 获取 KernelSU 提交信息 ====================
      # 获取当前使用的 KernelSU 版本的 Git 提交信息
      - name: 获取 KernelSU 提交信息
        env:
          MANAGER_KSU_COMMIT: ${{ needs.get-manager.outputs.ksuCommit }}
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "Official") REPO_URL="https://github.com/tiann/KernelSU.git"; REPO_URL2="tiann/KernelSU" ;;
            "Next") REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"; REPO_URL2="KernelSU-Next/KernelSU-Next" ;;
            "SukiSU"|"SukiSU(40726)"|"SukiSU(40548)") REPO_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"; REPO_URL2="SukiSU-Ultra/SukiSU-Ultra" ;;
            "BakaSU") REPO_URL="https://github.com/Baka-SU/BakaSU.git"; REPO_URL2="Baka-SU/BakaSU" ;;
            "FinaSU") REPO_URL="https://github.com/LyraVoid/FinaSU.git"; REPO_URL2="LyraVoid/FinaSU" ;;
          esac

          if [ "${{ inputs.kernelsu_variant }}" = "SukiSU" ] && [ -f "config/config" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" config/config | cut -d'=' -f2)
            CUSTOM_COMMIT=$(grep "^sukisu=" config/config | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" = "true" ] && [ -n "$CUSTOM_COMMIT" ]; then
              KSU_REF="$CUSTOM_COMMIT"
              KSU_URL="https://github.com/$REPO_URL2/commit/$CUSTOM_COMMIT"
              echo "BRANCH_INFO=custom" >> $GITHUB_ENV
            fi
          fi

          if [ "${{ inputs.kernelsu_variant }}" = "FinaSU" ] && [ -n "$MANAGER_KSU_COMMIT" ]; then
            KSU_REF="$MANAGER_KSU_COMMIT"
            KSU_URL="https://github.com/$REPO_URL2/commit/$MANAGER_KSU_COMMIT"
          fi

          if [ -z "${KSU_REF:-}" ]; then
            COMMIT_HASH=$(git ls-remote $REPO_URL refs/heads/${KSU_BRANCH:-main} | awk '{ print $1 }')
            KSU_REF=$COMMIT_HASH
            KSU_URL="https://github.com/$REPO_URL2/commit/$COMMIT_HASH"
          fi

          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV

      # ==================== 获取 SUSFS 提交信息 ====================
      # 获取各版本 SUSFS 的 Git 提交信息
      - name: 获取 SUSFS 提交信息
        if: inputs.enable_susfs
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          declare -A BRANCH_MAP=(
            ["gki_android12_5_10"]="gki-android12-5.10"
            ["gki_android13_5_15"]="gki-android13-5.15"
            ["gki_android14_6_1"]="gki-android14-6.1"
            ["gki_android15_6_6"]="gki-android15-6.6"
            ["gki_android16_6_12"]="gki-android16-6.12"
          )
          for var_name in "${!BRANCH_MAP[@]}"; do
            branch_name="${BRANCH_MAP[$var_name]}"
            COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/$branch_name | awk '{ print $1 }')
            if [[ -n "$COMMIT_HASH" ]]; then
              COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
              echo "COMMIT_HASH_${var_name}=$COMMIT_HASH" >> "$GITHUB_ENV"
              echo "COMMIT_URL_${var_name}=$COMMIT_URL" >> "$GITHUB_ENV"
            fi
          done

      # ==================== 生成发布说明 ====================
      # 创建包含详细信息的发布说明文档
      - name: 生成发布说明
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [[ "$KSU_REF" =~ ^[0-9a-f]{40}$ ]]; then
            KSU_DISPLAY_REF="${KSU_REF:0:7}"
          else
            KSU_DISPLAY_REF="$KSU_REF"
          fi
          KSU_COMMIT_LINE="- $KSU_NAME: [\`$KSU_DISPLAY_REF\`]($KSU_URL)"

          build_targets=""
          append_target() {
            local selected="$1" label="$2"
            if [[ "$selected" == "true" ]]; then
              if [[ -z "$build_targets" ]]; then
                build_targets="$label"
              else
                build_targets="$build_targets, $label"
              fi
            fi
          }
          append_target "${{ contains(inputs.build_targets, 'a12') || contains(inputs.build_targets, 'all') }}" "Android 12 / 5.10"
          append_target "${{ contains(inputs.build_targets, 'a13') || contains(inputs.build_targets, 'all') }}" "Android 13 / 5.15"
          append_target "${{ contains(inputs.build_targets, 'a14') || contains(inputs.build_targets, 'all') }}" "Android 14 / 6.1"
          append_target "${{ contains(inputs.build_targets, 'a15') || contains(inputs.build_targets, 'all') }}" "Android 15 / 6.6"
          append_target "${{ contains(inputs.build_targets, 'a16') || contains(inputs.build_targets, 'all') }}" "Android 16 / 6.12"
          if [[ -z "$build_targets" ]]; then
            build_targets="未选择"
          fi

          : > susfs_commits.md
          append_susfs_commit() {
            local selected="$1" label="$2" hash="$3" url="$4"
            if [[ "$selected" == "true" && -n "$hash" && -n "$url" ]]; then
              printf -- '- %s: [`%s`](%s)\n' "$label" "${hash:0:7}" "$url" >> susfs_commits.md
            fi
          }
          append_susfs_commit "${{ contains(inputs.build_targets, 'a12') || contains(inputs.build_targets, 'all') }}" "Android 12 / 5.10" "${COMMIT_HASH_gki_android12_5_10}" "${COMMIT_URL_gki_android12_5_10}"
          append_susfs_commit "${{ contains(inputs.build_targets, 'a13') || contains(inputs.build_targets, 'all') }}" "Android 13 / 5.15" "${COMMIT_HASH_gki_android13_5_15}" "${COMMIT_URL_gki_android13_5_15}"
          append_susfs_commit "${{ contains(inputs.build_targets, 'a14') || contains(inputs.build_targets, 'all') }}" "Android 14 / 6.1" "${COMMIT_HASH_gki_android14_6_1}" "${COMMIT_URL_gki_android14_6_1}"
          append_susfs_commit "${{ contains(inputs.build_targets, 'a15') || contains(inputs.build_targets, 'all') }}" "Android 15 / 6.6" "${COMMIT_HASH_gki_android15_6_6}" "${COMMIT_URL_gki_android15_6_6}"
          append_susfs_commit "${{ contains(inputs.build_targets, 'a16') || contains(inputs.build_targets, 'all') }}" "Android 16 / 6.12" "${COMMIT_HASH_gki_android16_6_12}" "${COMMIT_URL_gki_android16_6_12}"
          if [[ "${{ inputs.enable_susfs }}" != "true" ]]; then
            echo "- 本次构建未集成 SUSFS" > susfs_commits.md
          elif [[ ! -s susfs_commits.md ]]; then
            echo "- 未获取到本次构建对应的 SUSFS 提交信息" > susfs_commits.md
          fi

          cat > release_body.md << EOF
          ## GKI Kernel Release

          $RELEASE_HEADLINE

          | 项目 | 内容 |
          |:---|:---|
          | 发布类型 | ${{ inputs.release_type }} |
          | 发布时间 | $BUILD_DATE |
          | 构建范围 | $build_targets |

          ### 构建配置

          | 项目 | 内容 |
          |:---|:---|
          | 集成 SUSFS | ${{ inputs.enable_susfs && '是' || '否' }} |
          | KernelSU 变体 | $KSU_NAME |
          | KernelSU 分支 | $BRANCH_INFO |
          | SUSFS | $SUS_VER |
          | Hook 类型 | $HOOK_TYPE |
          | 挂载方式 | $MOUNT_TYPE |
          | LTO | thin |
          | BBG 安全补丁 | $BBG_STATUS |
          | ZRAM / LZ4KD | $LZ4_STATUS |
          | KPM | $KPM_STATUS |

          ### 下载说明

          请在下方 **Assets** 中下载对应文件。

          | 文件类型 | 用途 |
          |:---|:---|
          | \`*-AnyKernel3.zip\` | AnyKernel3 内核刷入包（文件名形如 android14-6.1.124-2025-02-AnyKernel3.zip，后缀固定为 -AnyKernel3.zip，不含 _kernel-） |
          | \`boot.img\` / \`boot-gz.img\` / \`boot-lz4.img\` | 可直接刷入的 boot 镜像（boot-lz4 仅在 Image.lz4 重建成功时产出，否则仅有前两者） |
          | \`*.apk\` | KernelSU 管理器 |
          | \`susfs-*.zip\` | SUSFS 配套模块 |
          | \`SUSFS-Patches-*.zip\` | SUSFS 集成补丁（SukiSU / BakaSU / FinaSU，供自行编译内核使用） |

          > [!IMPORTANT]
          > 刷入前请备份原厂 Boot 镜像。
          > 如果设备无法启动，请先恢复原厂镜像，再提取 KernelSU 日志进行反馈。

