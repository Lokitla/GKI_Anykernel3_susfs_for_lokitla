name: GetManager
permissions:
  contents: read   # 仅读取仓库内容（下载管理器 APK，本作业不推送 tag）
  actions: read    # 允许读取 actions 产物

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      kernelsu_variant:
        required: true
        type: string
      manager_spoofed:
        description: "是否一并拉取 Spoofed（伪装官方包名）管理器；关闭则只保留普通管理器"
        required: false
        type: boolean
        default: true
      ksu_branch_mode:
        description: "SukiSU 内核侧拉取的分支：auto/main/builtin。管理器始终来自 main，此参数仅用于日志与版本基准说明"
        required: false
        type: string
        default: "auto"
      # 由上游入口的合并输入框「提交 hash」传入。该框内容为
      # 「<管理器&内核KSU>,<SUSFS>」（逗号或竖线分隔，0 = 该段不指定），
      # 本工作流只用第 1 段（管理器 hash），拆分在下面完成，
      # 且与 build.yml 的解析规则保持一致（0 与竖线同样识别）。
      manager_commit:
        description: "提交 hash（合并输入框，本工作流只用第 1 段）：<管理器&内核KSU>,<SUSFS>，逗号或竖线分隔均可，0 = 该段不指定"
        required: false
        type: string
        default: ""
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

      managerVer:
        description: "实测下载到的 Manager APK versionCode（cf784f5 下载验证后）"
        value: ${{ jobs.get_ksu_manager.outputs.managerVer }}

      ksuCommit:
        description: "所选 Manager 构建对应的提交 SHA（内核侧对齐用；空=未对齐）"
        value: ${{ jobs.get_ksu_manager.outputs.ksuCommit }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-24.04
    outputs:
      # 输出1: KSU版本号
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # 输出2: SUSFS版本号
      susVer: ${{ steps.get_version.outputs.sversion }}
      # 输出3: Manager 实测版本号
      managerVer: ${{ steps.add_KSU.outputs.managerVer }}
      # 输出4: 所选 Manager 构建的提交 SHA（ksu_commit 对齐用）
      ksuCommit: ${{ steps.align_commit.outputs.ksuCommit }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KSU_BRANCH_MODE: ${{ inputs.ksu_branch_mode }}

    steps:
      - name: 🧐 Debug Workflow Caller Context
        run: |
          echo "==================== DEBUG CONTEXT ===================="
          echo " "
          echo "EVENT NAME: ${{ github.event_name }}"
          echo " "
          echo "--- CALLER INFORMATION ---"
          echo "  - Caller Repository: ${{ github.repository }}"
          echo "  - Calling Workflow:  ${{ github.workflow }}"
          echo "  - Called Workflow:   get-manager.yml"
          echo "  - Caller User:       ${{ github.triggering_actor }}"
          echo " "
          echo "--- WORKFLOW & JOB INFORMATION ---"
          echo "  - Current Workflow:  ${{ github.workflow }}"
          echo "  - Current Job ID:    ${{ github.job }}"
          echo "  - Current Run ID:    ${{ github.run_id }}"
          echo "  - Current Run Number:${{ github.run_number }}"
          echo " "
          echo "--- GIT REFERENCE INFORMATION ---"
          echo "  - Git Ref:           ${{ github.ref }}"
          echo "  - Ref Type:          ${{ github.ref_type }}"
          echo " "
          echo "======================================================="

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq

      # 读取 config/config 里的自定义提交配置，使管理器的版本选取
      # 与内核构建使用相同的 SukiSU 提交。
      - name: 检出本仓库配置
        uses: actions/checkout@v7
        with:
          sparse-checkout: config
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: 解析自定义提交配置
        id: custom_cfg
        run: |
          ENABLED=false
          COMMIT=""
          if [ -f config/config ]; then
            ENABLED=$(grep "^custom=" config/config | cut -d'=' -f2- | tr -d '\r' | xargs)
            COMMIT=$(grep "^sukisu=" config/config | cut -d'=' -f2- | tr -d '\r' | xargs)
          fi
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "自定义提交配置: enabled=$ENABLED sukisu=${COMMIT:-<未指定>}"

      - name: 获取 KSU & SUSFS 版本
        id: get_version
        env:
          # 安全：外部输入一律经 env 传入，run 块中不得出现 ${{ }}
          KSU_VARIANT: ${{ inputs.kernelsu_variant }}
          SUKISU_COMMIT_INPUT: ${{ inputs.manager_commit }}
          CUSTOM_ENABLED: ${{ steps.custom_cfg.outputs.enabled }}
          CUSTOM_COMMIT: ${{ steps.custom_cfg.outputs.commit }}
        run: |

          if [ "$KSU_VARIANT" == "Next" ]; then
            echo "This is the Next variant"
            git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          elif [ "$KSU_VARIANT" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "$KSU_VARIANT" == "SukiSU(40726)" ]; then
            echo "This is the SukiSU(40726) variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
            git -C KernelSU checkout 5da529942987b834c2b02a4819eaa298a8383bf4
          elif [ "$KSU_VARIANT" == "SukiSU(40548)" ]; then
            echo "This is the SukiSU(40548) variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
            git -C KernelSU checkout 3170a48c508f6330ea636c51835a84573fe56ef5
          elif [ "$KSU_VARIANT" == "BakaSU" ]; then
            echo "This is the BakaSU variant"
            git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          elif [ "$KSU_VARIANT" == "Official" ]; then
            echo "This is the Official"
            git clone https://github.com/tiann/KernelSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          # 统一 SukiSU 提交：优先用输入项，其次 config/config 的 sukisu=
          SUKISU_COMMIT="$SUKISU_COMMIT_INPUT"
          if [ -z "$SUKISU_COMMIT" ] && [ "$CUSTOM_ENABLED" = "true" ]; then
            SUKISU_COMMIT="$CUSTOM_COMMIT"
          fi
          # 合并输入框：只取第 1 段（管理器&内核KSU），第 2 段是 SUSFS hash，与管理器无关。
          # 与 build.yml 的解析规则保持一致：逗号或竖线分隔，0 = 该段不指定。
          # 不这么做的话，填 0,def456... 时这里会拿到字面的 "0"，
          # 进而执行 git fetch origin 0 并把 head_sha=0 带进版本查询。
          case "$SUKISU_COMMIT" in
            *"|"*) _sep='|' ;;
            *)     _sep=',' ;;
          esac
          SUKISU_COMMIT="${SUKISU_COMMIT%%$_sep*}"
          SUKISU_COMMIT=$(printf '%s' "$SUKISU_COMMIT" | tr -d '[:space:]' | tr -d '"' | tr -d "'")
          if [ "$SUKISU_COMMIT" = "0" ]; then SUKISU_COMMIT=""; fi

          # 管理器 APK 只能来自 main 分支：builtin 是只含 kernel/ 与 uapi/ 的独立分支，
          # 连 manager/ 目录都没有，不存在可用的 Manager CI 产物。
          # 因此这里只 fetch 被钉的 commit（用于溯源/校验），绝不 checkout 到它——
          # 一旦切到 builtin，工作区会失去 manager/ 等目录，且提交数基准从 main 的
          # 3737 变成 builtin 的 802，算出的版本号与内核不一致，管理器启动即闪退。
          if [ -n "$SUKISU_COMMIT" ] && [ "$KSU_VARIANT" = "SukiSU" ]; then
            echo "SukiSU 指定提交: $SUKISU_COMMIT（仅 fetch 校验，工作区保持 main）"
            if ! git -C KernelSU fetch --no-tags origin "$SUKISU_COMMIT" >/dev/null 2>&1; then
              echo "::warning::无法获取 SukiSU 提交 $SUKISU_COMMIT，继续按 main 处理"
            fi
          fi
          # 显式拉取 main 引用，供后续按 main 计数使用
          git -C KernelSU fetch --no-tags origin main:refs/remotes/origin/main >/dev/null 2>&1 || true
          echo "SUKISU_COMMIT=$SUKISU_COMMIT" >> "$GITHUB_ENV"

          cd KernelSU

          # 计算KSU版本号。
          # 基准固定为 main 分支的提交数，与内核侧 setup.sh 产出的版本口径一致。
          if [ "$KSU_VARIANT" == "SukiSU" ]; then
            # 与内核侧 setup.sh 完全一致的双路取大口径：
            #   API 的 Link rel=last 分页数 vs 本地 git rev-list 计数，取较大者。
            # 过去这里只用 git 计数，而内核侧用 max(API, git)——浅克隆时 git 计数偏小，
            # 于是管理器算出的目标版本低于内核真实版本，挑出来的 APK 天然落后几版。
            local_count=$(git rev-list --count refs/remotes/origin/main 2>/dev/null)
            api_count=$(curl -sI "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/commits?sha=main&per_page=1" 2>/dev/null |
              grep -i "^link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p')
            KSU_GIT_VERSION="$local_count"
            if [ -n "$api_count" ] && [ -n "$local_count" ] && [ "$api_count" -ge "$local_count" ] 2>/dev/null; then
              KSU_GIT_VERSION="$api_count"
            elif [ -z "$KSU_GIT_VERSION" ]; then
              KSU_GIT_VERSION=$(git rev-list --count HEAD)
            fi
            echo "SukiSU: main 提交数 = $KSU_GIT_VERSION（api=$api_count local=$local_count，分支模式输入: $KSU_BRANCH_MODE）"
          else
            KSU_GIT_VERSION=$(git rev-list --count HEAD)
          fi

          if [ "$KSU_VARIANT" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          elif [ "$KSU_VARIANT" == "SukiSU(40726)" ]; then
            KSU_VERSION=40726
          elif [ "$KSU_VARIANT" == "SukiSU(40548)" ]; then
            KSU_VERSION=40548
          elif [ "$KSU_VARIANT" == "BakaSU" ]; then
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          elif [ "$KSU_VARIANT" == "Official" ]; then
            KSU_VERSION=$((20000 + KSU_GIT_VERSION))
          elif [ "$KSU_VARIANT" == "Next" ]; then
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # 计算SUSFS版本号
          if [ "$KSU_VARIANT" == "SukiSU(40726)" ]; then
            SUS_VERSION="v2.1.0"
          elif [ "$KSU_VARIANT" == "SukiSU(40548)" ]; then
            SUS_VERSION="v2.0.0"
          else
            INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop\?ref_type\=heads"
            SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          fi
          echo $SUS_VERSION

          # 导出这两个值给release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

      - name: 添加 KernelSU
        id: add_KSU
        continue-on-error: true
        env:
          KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        run: |
          case "$KSU_VARIANT" in
            "SukiSU(40726)") LEGACY_RELEASE_TAG="v2.1.0-r2"; LEGACY_DIR="SukiSU_40726" ;;
            "SukiSU(40548)") LEGACY_RELEASE_TAG="v2.0.0-r34"; LEGACY_DIR="SukiSU_40548" ;;
            *) LEGACY_RELEASE_TAG="" ;;
          esac
          if [ -n "$LEGACY_RELEASE_TAG" ]; then
            echo "下载 $KSU_VARIANT 管理器..."
            mkdir -p "manager-artifacts/$LEGACY_DIR"
            MANAGER_URL=$(curl -fsSL "https://api.github.com/repos/zzh20188/GKI_KernelSU_SUSFS/releases/tags/$LEGACY_RELEASE_TAG" |
              jq -r '.assets[] | select(.name | startswith("SukiSU_") and endswith("-release.apk")) | .browser_download_url' |
              head -n 1)
            if [ -z "$MANAGER_URL" ]; then
              echo "未找到 $KSU_VARIANT 管理器下载地址。"
              exit 1
            fi
            curl -fL -o "manager-artifacts/$LEGACY_DIR/${LEGACY_DIR}-release.apk" "$MANAGER_URL"
            exit 0
          fi

          if [ "$KSU_VARIANT" == "Next" ]; then
            echo "KernelSU Next..."
            REPO="KernelSU-Next/KernelSU-Next"
            KSUM="manager"
            BRANCH="dev"
          elif [ "$KSU_VARIANT" == "SukiSU" ]; then
            echo "SukiSU..."
            REPO="SukiSU-Ultra/SukiSU-Ultra"
            KSUM="manager"
          elif [ "$KSU_VARIANT" == "BakaSU" ]; then
            echo "BakaSU..."
            REPO="Baka-SU/BakaSU"
            KSUM="manager"
          elif [ "$KSU_VARIANT" == "Official" ]; then
            echo "KSU..."
            REPO="tiann/KernelSU"
            KSUM="manager"
          fi

          FILENAME=$([[ "$KSU_VARIANT" == "Next" ]] && echo "build-manager-ci.yml" || echo "build-manager.yml")


          # 按内核 KSU 版本选择 Manager，避免 APK 版本领先于内核版本
          TARGET_KSU_VERSION="${KSU_VERSION:-}"
          if ! [[ "$TARGET_KSU_VERSION" =~ ^[0-9]+$ ]]; then
            echo "无效的目标 KSU 版本: $TARGET_KSU_VERSION"
            exit 1
          fi

          calculate_run_ksu_version() {
            local head_sha="$1"
            local git_version=""

            # 【口径必须与内核侧一致】build_kernel.sh 的 resolve_sukisu_version 是按
            # GitHub API（commits?sha=main 的 Link rel=last）取提交数的，管理器这边
            # 候选 run 的版本也必须走同一条路。
            #
            # KernelSU 是 fetch-depth:1 的浅克隆，不能用 git rev-list --count，
            # rev-list 的结果取决于本地抓取深度，同一个 commit 两次运行能数出不同值
            # —— 于是同一份脚本，一次严格命中 40922，一次退到 40879，稳定性为零。
            # API 口径既稳定又与内核侧对齐；本地 git 仅作 API 拿不到时的兜底。
            git_version=$(curl -sI -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/commits?sha=$head_sha&per_page=1" 2>/dev/null |
                grep -i "^link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p')

            if [ -z "$git_version" ]; then
              if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
                git -C KernelSU fetch --no-tags origin "$head_sha" >/dev/null 2>&1 || true
              fi
              if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
                return 1
              fi
              # Manager CI 只跑在 main 上，必须按 main 的计数口径算。
              # 若该 commit 属于 builtin（独立分支，提交数仅 802），直接计数会得到
              # 远低于实际的版本号，从而把"候选管理器版本"误判为低于内核版本，
              # 最终选中一个过旧的 APK。
              if [ "$KSU_VARIANT" = "SukiSU" ] && \
                 git -C KernelSU cat-file -e refs/remotes/origin/builtin^{commit} 2>/dev/null && \
                 git -C KernelSU merge-base --is-ancestor "$head_sha" refs/remotes/origin/builtin 2>/dev/null; then
                git_version=$(git -C KernelSU rev-list --count refs/remotes/origin/main)
              else
                git_version=$(git -C KernelSU rev-list --count "$head_sha")
              fi
            fi

            if [ "$KSU_VARIANT" = "SukiSU" ] && ! [ "$git_version" -gt 802 ] 2>/dev/null; then
              echo "::warning::$head_sha 的提交数 $git_version 低于 builtin 规模，疑似计数基准错误，跳过该构建" >&2
              return 1
            fi

            case "$KSU_VARIANT" in
              "SukiSU") echo $((40000 + git_version - 2815)) ;;
              "BakaSU") echo $((30700 + git_version)) ;;
              "Official") echo $((20000 + git_version)) ;;
              "Next") echo $((30000 + git_version)) ;;
              *) return 1 ;;
            esac
          }

          # Spoofed（伪装官方 KernelSU 包名）管理器开关
          #   开启：一并拉取 Spoofed-Manager（伪装官方包名的管理器）
          #   关闭：过滤掉所有名字含 spoofed 的产物，只保留普通管理器
          WANT_SPOOFED="${{ inputs.manager_spoofed }}"
          case "$WANT_SPOOFED" in
            true|TRUE|True|1) JQ_SPOOFED=true ;;
            *) JQ_SPOOFED=false ;;
          esac
          echo "拉取 Spoofed 管理器: $JQ_SPOOFED"

          get_manager_artifacts() {
            local artifacts="$1"
            if [ "$KSU_VARIANT" == "Next" ]; then
              printf '%s' "$artifacts" | jq -r --arg name "$KSUM" --argjson sp "$JQ_SPOOFED" \
                '.artifacts[] | select(.name == $name) | select($sp or ((.name | ascii_downcase) | contains("spoofed") | not)) | "\(.name)\t\(.archive_download_url)"'
            elif [ "$KSU_VARIANT" == "BakaSU" ]; then
              printf '%s' "$artifacts" | jq -r --argjson sp "$JQ_SPOOFED" \
                '.artifacts[] | select(.name == "Manager-release" or ($sp and .name == "Spoofed-Manager-release")) | "\(.name)\t\(.archive_download_url)"'
            else
              # 排除 -gradle / -mappings 中间产物：它们与最终 APK 同名同尺寸，
              # 一并下载会让最终产物里混入未签名的中间 APK（每个变体多出一个）。
              printf '%s' "$artifacts" | jq -r --arg needle "$KSUM" --argjson sp "$JQ_SPOOFED" \
                '.artifacts[]
                 | select((.name | ascii_downcase) | contains($needle))
                 | select((.name | ascii_downcase) | (endswith("gradle") or endswith("mappings")) | not)
                 | select($sp or ((.name | ascii_downcase) | contains("spoofed") | not))
                 | "\(.name)\t\(.archive_download_url)"'
            fi
          }

          # ═══════════════════════════════════════════════════════════
          # 从 APK 文件名提取实际 versionCode
          # 文件名格式：BakaSU_v4.2.0-rc2_35163-arm64-v8a-release.apk
          #          KernelSU_v40924_20260929_arm64.apk
          # 取第一段 >=4 位数字（与「校验管理器 APK 版本」步骤同一口径）：
          #   BakaSU_v4.2.0-rc2_35163-... → 35163
          #   KernelSU_v40924_20260929_... → 40924（不会误取日期 20260929）
          # ═══════════════════════════════════════════════════════════
          extract_apk_version() {
            local apk_name="$1"
            echo "$apk_name" | grep -oE '[0-9]{4,}' | head -n 1
          }

          DOWNLOAD_LIST=""
          BEST_VERSION=0
          BEST_BUILD_ID=""
          BEST_BRANCH=""
          # 实际版本验证（cf784f5）：下载后从 APK 文件名提取实际版本
          BEST_ACTUAL=0        # 实际版本最大值
          BEST_DIR=""          # 最佳候选目录
          MATCHED=0            # 是否精确匹配
          MAX_FETCH=6          # 限制下载数量，避免浪费带宽
          FETCHED=0            # 已下载数量
          BEST_SHA=""          # 最佳候选 run 的 head_sha（内核对齐用）
          # 严格对齐用：精确等于内核 KSU 版本的候选
          EXACT_LIST=""
          EXACT_ID=""
          EXACT_BRANCH=""
          EXACT_VERSION=0
          EXACT_SHA=""
          # 分支过滤（重要）：早期这里不加过滤，因为上游 Manager CI 一度只跑在
          # 发布分支上（见下方 calculate_run_ksu_version 的说明）。但上游现在会在
          # 各类功能/修复分支上触发 build-manager.yml —— 实测 SukiSU-Ultra 最近 30
          # 次成功构建里 16 次来自 cpu_spoof / mount_hide / fix/* / chore/* 等分支。
          # 这些 APK 携带分支特性，版本串或应用名里会出现 PR / 分支标记，
          # 导致管理器版本与内核对不上。正式产物必须只在发布分支上找。
          case "$KSU_VARIANT" in
            "Next") RELEASE_BRANCH="dev" ;;
            *)      RELEASE_BRANCH="main" ;;
          esac
          # 不要在 URL 上依赖 branch= 过滤！实测 GitHub 的 branch= 会把 main 分支上
          # 真正最新的那条成功构建滤掉：
          #   不带过滤  → 能查到 34761911123（head=7755cdb36f63，即 main HEAD，KSU 40922）
          #   带 branch=main → 只剩 31890547561（08-15 的旧产物，KSU 40879）
          # 结果是内核按 main 提交数算出 40922，管理器却降到 40879，差 43；而产物名
          # 又恒定取目标值，看起来像 40922，实际 APK 是旧的 —— 这正是"管理器与内核
          # 版本对不上"且时好时坏的根因。
          # 改为全量拉取，在下方循环里按 head_branch 自行过滤，两边效果一致且可靠。
          RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?status=success&per_page=100"
          echo "Manager 查找范围: $REPO/$FILENAME @ $RELEASE_BRANCH（全量拉取后按 head_branch 过滤）"

          # 指定了 SukiSU 提交时，直接定位该提交触发的 Manager 构建：
          # Manager CI 的 head_sha 就是 SukiSU 的提交，因此可精确命中，
          # 保证管理器与内核完全来自同一个 commit。
          if [ -n "$SUKISU_COMMIT" ] && [ "$KSU_VARIANT" = "SukiSU" ]; then
            echo "按指定提交 $SUKISU_COMMIT 精确查找 Manager 构建..."
            PINNED_RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?head_sha=$SUKISU_COMMIT&status=success&per_page=5")
            PINNED_ID=$(printf '%s' "$PINNED_RUNS" | jq -r '.workflow_runs[0].id // empty')
            if [ -n "$PINNED_ID" ]; then
              # 过滤 pull_request 事件：fork 的 main 分支发起 PR 时 head_branch 也是 main，
              # 但 head_sha 指向的是 fork 的提交，不是上游的发布构建。
              PINNED_EVENT=$(printf '%s' "$PINNED_RUNS" | jq -r '.workflow_runs[0].event // "push"')
              PINNED_BRANCH=$(printf '%s' "$PINNED_RUNS" | jq -r '.workflow_runs[0].head_branch // "main"')
              if [ "$PINNED_EVENT" = "pull_request" ]; then
                echo "::warning::提交 $SUKISU_COMMIT 的构建 $PINNED_ID 来自 pull_request（$PINNED_BRANCH），跳过（仅接受 push/workflow_dispatch）"
                PINNED_ID=""
              fi
            fi
            if [ -n "$PINNED_ID" ]; then
              ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$PINNED_ID/artifacts")
              CANDIDATE_LIST=$(get_manager_artifacts "$ARTIFACTS")
              if [ -n "$CANDIDATE_LIST" ]; then
                DOWNLOAD_LIST="$CANDIDATE_LIST"
                BEST_BUILD_ID="$PINNED_ID"
                BEST_BRANCH="pinned"
                BEST_SHA="$SUKISU_COMMIT"
                echo "命中指定提交的 Manager 构建: $PINNED_ID"
              else
                echo "::warning::提交 $SUKISU_COMMIT 的构建 $PINNED_ID 中没有匹配的 Manager 产物，回退按版本查找"
              fi
            else
              echo "::warning::提交 $SUKISU_COMMIT 没有成功的 Manager 构建（或来自 PR），回退按版本查找（将取不高于该版本的最新产物）"
            fi
          fi

          if [ -z "$DOWNLOAD_LIST" ]; then
          echo "开始查找不高于 KSU $TARGET_KSU_VERSION 的 Manager 产物..."
          # 每个候选现在要打一次 API 取版号，翻页上限从 10 收到 3：
          # 严格命中通常就落在第 1 页（最新的那批构建），扫不到才说明真没有。
          for PAGE in $(seq 1 3); do
            echo "--------------------------------------------------"
            echo "正在检查第 ${PAGE} 页历史构建..."
            RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" "$RUNS_URL&page=$PAGE")
            RUN_COUNT=$(printf '%s' "$RUNS" | jq '.workflow_runs | length')
            if [ "$RUN_COUNT" -eq 0 ]; then
              break
            fi

            for INDEX in $(seq 0 $((RUN_COUNT - 1))); do
              BUILD_ID=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].id")
              HEAD_SHA=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_sha")
              HEAD_BRANCH=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_branch")
              EVENT_NAME=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].event")

              # 发布分支过滤在这里自己做，而不是交给 API 的 branch= 参数（见上方说明）。
              # 必须同时排除 pull_request 事件：fork 的 main 分支发起 PR 时 head_branch 也是 main，
              # 但产物是 PR 构建（未合入 main），不能当发布版本用。
              if [ "$HEAD_BRANCH" != "$RELEASE_BRANCH" ] || [ "$EVENT_NAME" = "pull_request" ]; then
                continue
              fi

              RUN_KSU_VERSION=$(calculate_run_ksu_version "$HEAD_SHA" || true)
              if ! [[ "$RUN_KSU_VERSION" =~ ^[0-9]+$ ]]; then
                echo "跳过构建 $BUILD_ID: 无法根据提交 $HEAD_SHA 计算 KSU 版本"
                continue
              fi
              if [ "$RUN_KSU_VERSION" -gt "$TARGET_KSU_VERSION" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): Manager KSU $RUN_KSU_VERSION 高于内核 KSU $TARGET_KSU_VERSION"
                continue
              fi

              ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$BUILD_ID/artifacts")
              CANDIDATE_LIST=$(get_manager_artifacts "$ARTIFACTS")
              if [ -z "$CANDIDATE_LIST" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): 未找到包含 '$KSUM' 的产物"
                continue
              fi

              # 严格对齐优先：版本号必须精确等于内核的 KSU 版本。
              # 命中即收手，不再往下扫更旧的候选。
              if [ "$RUN_KSU_VERSION" -eq "$TARGET_KSU_VERSION" ]; then
                EXACT_LIST="$CANDIDATE_LIST"
                EXACT_ID="$BUILD_ID"
                EXACT_BRANCH="$HEAD_BRANCH"
                EXACT_VERSION="$RUN_KSU_VERSION"
                EXACT_SHA="$HEAD_SHA"
                echo "候选 Manager(严格命中): 构建 $BUILD_ID ($HEAD_BRANCH), KSU $RUN_KSU_VERSION"
                break 2
              fi

              # 未精确命中：先记下「不高于内核的最大值」备用，最终是否采用由下方裁决
              if [ -z "$DOWNLOAD_LIST" ] || [ "$RUN_KSU_VERSION" -gt "$BEST_VERSION" ]; then
                DOWNLOAD_LIST="$CANDIDATE_LIST"
                BEST_VERSION="$RUN_KSU_VERSION"
                BEST_BUILD_ID="$BUILD_ID"
                BEST_BRANCH="$HEAD_BRANCH"
                BEST_SHA="$HEAD_SHA"
                echo "候选 Manager(备选): 构建 $BUILD_ID ($HEAD_BRANCH), KSU $RUN_KSU_VERSION"
              fi
            done
          done
          fi

          # ---------- 严格对齐裁决 ----------
          # 过去的写法是「取不高于内核版本的最大值」，找不到相等就悄悄用一个
          # 更旧的 APK —— 这正是「内核 40924 / 管理器被挑成 40922」这类错配的来源。
          # 现在：有精确匹配就只用它；没有则明确告警，把落后幅度摆到台面上。
          if [ -n "$EXACT_LIST" ]; then
            DOWNLOAD_LIST="$EXACT_LIST"
            BEST_BUILD_ID="$EXACT_ID"
            BEST_BRANCH="$EXACT_BRANCH"
            BEST_VERSION="$EXACT_VERSION"
            BEST_SHA="$EXACT_SHA"
            echo "✓ 管理器与内核严格对齐: KSU $TARGET_KSU_VERSION（构建 $BEST_BUILD_ID @ $BEST_BRANCH）"
          elif [ -n "$DOWNLOAD_LIST" ]; then
            LAG=$((TARGET_KSU_VERSION - BEST_VERSION))
            echo "::warning::未找到与内核 KSU $TARGET_KSU_VERSION 严格匹配的 Manager 构建，回退使用 $BEST_VERSION（构建 $BEST_BUILD_ID @ $BEST_BRANCH），版本落后 $LAG。管理器与内核版本不一致，刷入后可能提示版本不匹配。若经常发生，可在构建入口的「管理器提交 hash」里锁定同一个提交。"
          fi

          if [ -z "$DOWNLOAD_LIST" ]; then
            echo "未获取到 KSU 版本小于等于 $TARGET_KSU_VERSION 的 Manager artifact 下载地址列表。"
            exit 1
          fi
          echo "选择 Manager 构建 $BEST_BUILD_ID ($BEST_BRANCH), KSU $BEST_VERSION"

          # 产物名要写【实际下载到的 APK 版本】而不是内核目标版本。回退发生时两者
          # 不同，标成目标值会让人误以为拿到的就是严格匹配的那个 APK——这也是之前
          # 明明差了 43 个版本、产物名却一直是 (40922) 的原因。
          # cf784f5: 改为下载后验证实际版本，避免估算版本与实际版本不一致。
          # 注意：用 printf %b 写入临时文件，保留 tab 和换行
          echo "开始下载并验证 Manager APK 实际版本..."
          
          # 创建临时候选目录
          CANDIDATE_BASE="/tmp/manager_candidates_$$"
          mkdir -p "$CANDIDATE_BASE"
          
          # 将下载列表写入临时文件（用 printf %b 保留 tab 和换行）
          DOWNLOAD_LIST_FILE="/tmp/download_list_$$.txt"
          printf '%b' "$DOWNLOAD_LIST" > "$DOWNLOAD_LIST_FILE"
          
          FETCHED=0
          MATCHED=0
          BEST_ACTUAL=0
          BEST_DIR=""
          
          # 下载并验证每个候选 APK
          while IFS= read -r LINE; do
            # 跳过空行
            [ -z "$LINE" ] && continue
            
            # 用 awk 解析 tab 分隔的 NAME 和 URL
            NAME=$(echo "$LINE" | awk -F'\t' '{print $1}')
            URL=$(echo "$LINE" | awk -F'\t' '{print $2}')
            
            # 跳过无效行
            [ -z "$NAME" ] && continue
            [ -z "$URL" ] && continue
            
            # 限制下载数量
            FETCHED=$((FETCHED + 1))
            if [ "$FETCHED" -gt "$MAX_FETCH" ]; then
              echo "已达下载上限 $MAX_FETCH，停止扫描"
              break
            fi
            
            SAFE_NAME=$(echo "$NAME" | tr '/ ' '__')
            ZIP_NAME="$KSU_VARIANT-${SAFE_NAME}(${{ env.KSU_VERSION }}).zip"
            
            # 下载 APK 到临时目录
            CANDIDATE_DIR="$CANDIDATE_BASE/$FETCHED"
            mkdir -p "$CANDIDATE_DIR"
            APK_PATH="$CANDIDATE_DIR/$NAME"
            
            echo "下载候选 $FETCHED: $NAME"
            curl -L -H "Authorization: token $GH_TOKEN" -o "$APK_PATH" "$URL"
            
            # artifact 是 zip 压缩包，真实版本号在包内 APK 文件名上：
            # 先解压再找 APK，不能拿 artifact 名（如 Spoofed-Manager-release）提取版本
            mkdir -p "$CANDIDATE_DIR/extracted"
            if ! unzip -q "$APK_PATH" -d "$CANDIDATE_DIR/extracted" 2>/dev/null; then
              echo "⚠️  无法解压产物，跳过：$NAME"
              rm -rf "$CANDIDATE_DIR"
              continue
            fi
            APK_FILE=$(find "$CANDIDATE_DIR/extracted" -type f -name "*.apk" -print -quit)
            if [ -z "$APK_FILE" ]; then
              echo "⚠️  产物中没有 APK，跳过：$NAME"
              rm -rf "$CANDIDATE_DIR"
              continue
            fi
            
            # 从 APK 文件名提取实际版本
            ACTUAL_VERSION=$(extract_apk_version "$(basename "$APK_FILE")")
            
            if ! [[ "$ACTUAL_VERSION" =~ ^[0-9]+$ ]]; then
              echo "⚠️  无法提取版本，跳过：$NAME"
              rm -rf "$CANDIDATE_DIR"
              continue
            fi
            
            echo "候选 $FETCHED: 实际版本=$ACTUAL_VERSION, 目标版本=$TARGET_KSU_VERSION"
            
            # ═══ 版本验证 ═══
            if [ "$ACTUAL_VERSION" -gt "$TARGET_KSU_VERSION" ]; then
              # ❌ 实际版本 > 内核版本 → 拒绝
              echo "❌ 拒绝：实际版本 $ACTUAL_VERSION > 内核版本 $TARGET_KSU_VERSION"
              rm -rf "$CANDIDATE_DIR"
              continue
            fi
            
            if [ "$ACTUAL_VERSION" -eq "$TARGET_KSU_VERSION" ]; then
              # ✅ 精确匹配 → 立即停止，清理其他候选
              echo "✅ 精确匹配：实际版本 $ACTUAL_VERSION"
              MATCHED=1
              BEST_ACTUAL="$ACTUAL_VERSION"
              BEST_DIR="$CANDIDATE_DIR"
              # 清理其他候选
              find "$CANDIDATE_BASE" -mindepth 1 -maxdepth 1 -type d \
                ! -path "$CANDIDATE_DIR" -exec rm -rf {} +
              break
            elif [ "$ACTUAL_VERSION" -gt "$BEST_ACTUAL" ]; then
              # ⚠️ 未匹配但更高 → 记录为备选
              echo "⚠️  备选：实际版本 $ACTUAL_VERSION (当前最佳 $BEST_ACTUAL)"
              rm -rf "$BEST_DIR" 2>/dev/null || true
              BEST_ACTUAL="$ACTUAL_VERSION"
              BEST_DIR="$CANDIDATE_DIR"
            else
              # 更低版本 → 丢弃
              echo "丢弃：实际版本 $ACTUAL_VERSION < 当前最佳 $BEST_ACTUAL"
              rm -rf "$CANDIDATE_DIR"
            fi
          done < "$DOWNLOAD_LIST_FILE"
          
          # 清理临时文件
          rm -f "$DOWNLOAD_LIST_FILE"
          
          # ═══ 裁决：用实际版本命名 ═══
          if [ -n "$BEST_DIR" ]; then
            # 解压最佳候选到工作目录
            mkdir -p "manager-artifacts"
            for f in "$BEST_DIR"/*; do
              # 跳过 extracted 子目录，只解压下载下来的 zip（文件名即 artifact 名，
              # 分流步骤依赖这个子目录名区分 spoofed/普通）
              [ -f "$f" ] || continue
              SAFE_NAME=$(basename "$f" | tr '/ ' '__')
              unzip -o "$f" -d "manager-artifacts/$SAFE_NAME"
            done
            
            if [ "$MATCHED" -eq 1 ]; then
              echo "✅ 精确匹配成功：版本 $BEST_ACTUAL"
            else
              echo "⚠️  未找到精确匹配，使用最高版本 $BEST_ACTUAL (目标 $TARGET_KSU_VERSION)"
              echo "::warning::管理器版本 $BEST_ACTUAL 落后内核版本 $TARGET_KSU_VERSION"
            fi

            # 用实际版本命名（对齐原始数据交给「计算对齐提交」步骤）
            echo "MANAGER_VERSION=$BEST_ACTUAL" >> $GITHUB_ENV
            echo "managerVer=$BEST_ACTUAL" >> $GITHUB_OUTPUT
            echo "MANAGER_SHA=${BEST_SHA:-}" >> $GITHUB_ENV
            echo "MANAGER_MATCHED=$MATCHED" >> $GITHUB_ENV
          else
            echo "::error::未找到任何有效 Manager APK"
            exit 1
          fi
          
          # 清理临时目录
          rm -rf "$CANDIDATE_BASE"

          if [ "$KSU_VARIANT" == "BakaSU" ]; then
            echo "仅保留 BakaSU arm64-v8a release 管理器..."
            find manager-artifacts -type f -name "*.apk" ! -name "*-arm64-v8a-release.apk" -delete
            find manager-artifacts -type f -name "*debug*.apk" -delete
            if ! find manager-artifacts -type f -name "*-arm64-v8a-release.apk" | grep -q .; then
              echo "未找到 BakaSU arm64-v8a release 管理器。"
              exit 1
            fi
            find manager-artifacts -type f -name "*.apk" -print
          fi

      - name: 计算对齐提交（ksu_commit）
        id: align_commit
        if: steps.add_KSU.outcome == 'success'
        env:
          KSU_VERSION: ${{ env.KSU_VERSION }}
          MANAGER_VERSION: ${{ env.MANAGER_VERSION }}
          MANAGER_SHA: ${{ env.MANAGER_SHA }}
          MANAGER_MATCHED: ${{ env.MANAGER_MATCHED }}
        run: |
          # BakaSU 对齐：内核 KernelSU 检出到所选 Manager 构建同一提交；
          # 回退落后超过 ALIGN_CAP(=5) 时放弃对齐（KSU_COMMIT 空=main HEAD）
          TARGET_KSU_VERSION="${KSU_VERSION:-}"
          ALIGN_CAP="${ALIGN_CAP:-5}"
          KSU_COMMIT=""
          if [ -n "$MANAGER_SHA" ] && [ -n "$TARGET_KSU_VERSION" ] && [ -n "$MANAGER_VERSION" ]; then
            LAG=$((TARGET_KSU_VERSION - MANAGER_VERSION))
            if [ "$LAG" -ge 0 ] 2>/dev/null && [ "$LAG" -le "$ALIGN_CAP" ] 2>/dev/null; then
              KSU_COMMIT="$MANAGER_SHA"
              echo "✅ 内核对齐 Manager 构建提交 ${MANAGER_SHA:0:9}（KSU $MANAGER_VERSION）"
            else
              echo "::warning::Manager 落后超过 $ALIGN_CAP，放弃内核对齐（保持上游 main HEAD）"
            fi
          fi
          echo "KSU_COMMIT=${KSU_COMMIT:-}" >> $GITHUB_ENV
          echo "ksuCommit=${KSU_COMMIT}" >> $GITHUB_OUTPUT

      - name: 添加 SUSFS 模块
        id: add_SUSFS
        continue-on-error: true
        env:
          KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        run: |
          set -euo pipefail

          case "$KSU_VARIANT" in
            "SukiSU(40726)") LEGACY_RELEASE_TAG="v2.1.0-r2"; LEGACY_SUSFS_VERSION="v2.1.0" ;;
            "SukiSU(40548)") LEGACY_RELEASE_TAG="v2.0.0-r34"; LEGACY_SUSFS_VERSION="v2.0.0" ;;
            *) LEGACY_RELEASE_TAG="" ;;
          esac
          if [ -n "$LEGACY_RELEASE_TAG" ]; then
            echo "下载 $KSU_VARIANT 对应的 SUSFS 模块..."
            mkdir -p susfs-module
            curl -fL -o susfs-module/ksu_module_susfs.zip \
              "https://github.com/zzh20188/GKI_KernelSU_SUSFS/releases/download/$LEGACY_RELEASE_TAG/ksu_module_susfs.zip"
            echo "SUSFS_NAME=$LEGACY_SUSFS_VERSION" >> "$GITHUB_ENV"
            exit 0
          fi

          API_ROOT="https://api.github.com/repos/sidex15/susfs4ksu-module"
          CURL_ARGS=(--fail-with-body --silent --show-error --location
            --retry 3 --retry-all-errors --retry-delay 2
            --connect-timeout 15 --max-time 120)
          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT

          github_api() {
            : > "$WORKDIR/api.json"
            if ! curl "${CURL_ARGS[@]}" -H "Authorization: Bearer $GH_TOKEN" \
              -o "$WORKDIR/api.json" "$1"; then
              echo "::error::GitHub API 请求重试后仍失败: $1" >&2
              if [ -s "$WORKDIR/api.json" ]; then
                cat "$WORKDIR/api.json" >&2
              fi
              return 1
            fi
            cat "$WORKDIR/api.json"
          }

          RUNS=$(github_api "$API_ROOT/actions/workflows/build.yml/runs?status=success&per_page=30")
          if ! BUILD_IDS=$(jq -er '
            .workflow_runs | if type != "array" then error("构建列表不是数组")
            else .[] | .id | select(type == "number" and . > 0 and . == floor) end
          ' <<< "$RUNS"); then
            echo "::error::SUSFS 构建列表无效或没有成功构建" >&2
            exit 1
          fi

          DOWNLOAD_URL=""
          NAME=""
          while IFS= read -r BUILD_ID; do
            ARTIFACTS=$(github_api "$API_ROOT/actions/runs/$BUILD_ID/artifacts?per_page=100")
            if ! CANDIDATE=$(jq -c --arg prefix "$API_ROOT/actions/artifacts/" '
              if (.artifacts | type) != "array" then error("产物列表不是数组")
              else [.artifacts[]
                | select(.expired == false)
                | select(.name | strings | test("^[^\\r\\n]+$"))
                | select(.archive_download_url | strings | startswith($prefix))
                | select(.archive_download_url | ltrimstr($prefix) | test("^[1-9][0-9]*/zip$"))
              ][0] // empty end
            ' <<< "$ARTIFACTS"); then
              echo "::error::SUSFS 构建 $BUILD_ID 的产物列表无效" >&2
              exit 1
            fi
            if [ -z "$CANDIDATE" ]; then
              echo "::warning::SUSFS 构建 $BUILD_ID 没有可用产物，继续检查历史构建"
              continue
            fi
            NAME=$(jq -r '.name' <<< "$CANDIDATE")
            DOWNLOAD_URL=$(jq -r '.archive_download_url' <<< "$CANDIDATE")
            echo "选择 SUSFS 模块: 构建 $BUILD_ID，产物 $NAME"
            break
          done <<< "$BUILD_IDS"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::最近 30 次成功构建中没有未过期且下载地址有效的 SUSFS 模块产物" >&2
            exit 1
          fi

          curl "${CURL_ARGS[@]}" -H "Authorization: Bearer $GH_TOKEN" \
            -o "$WORKDIR/artifact.zip" "$DOWNLOAD_URL"
          if ! unzip -tq "$WORKDIR/artifact.zip" >/dev/null; then
            echo "::error::SUSFS Actions artifact ZIP 校验失败" >&2
            exit 1
          fi
          unzip -q "$WORKDIR/artifact.zip" -d "$WORKDIR/extracted"

          mkdir -p "$WORKDIR/module"
          shopt -s nullglob
          MODULE_ZIPS=("$WORKDIR/extracted/"*.zip)
          if [ "${#MODULE_ZIPS[@]}" -gt 0 ]; then
            cp -- "${MODULE_ZIPS[@]}" "$WORKDIR/module/"
          else
            (cd "$WORKDIR/extracted" && zip -qr "$WORKDIR/module/ksu_module_susfs.zip" .)
          fi

          MODULE_ZIP_COUNT=0
          for module_zip in "$WORKDIR/module/"*.zip; do
            [ -f "$module_zip" ] || continue
            MODULE_ZIP_COUNT=$((MODULE_ZIP_COUNT + 1))
            if ! unzip -tq "$module_zip" >/dev/null; then
              echo "::error::SUSFS 模块 ZIP 校验失败: $(basename "$module_zip")" >&2
              exit 1
            fi
            if ! unzip -Z1 "$module_zip" | grep -Eq '(^|/)module\.prop$'; then
              echo "::error::SUSFS 模块 ZIP 缺少 module.prop: $(basename "$module_zip")" >&2
              exit 1
            fi
          done
          if [ "$MODULE_ZIP_COUNT" -eq 0 ]; then
            echo "::error::整理后没有可用的 SUSFS 模块 ZIP" >&2
            exit 1
          fi

          rm -rf susfs-module
          mv "$WORKDIR/module" susfs-module
          echo "SUSFS_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SUSFS 模块已下载并整理完成"

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure' || steps.add_SUSFS.outcome == 'failure'
        env:
          KSU_OUTCOME: ${{ steps.add_KSU.outcome }}
          SUSFS_OUTCOME: ${{ steps.add_SUSFS.outcome }}
        run: |
          if [ "$KSU_OUTCOME" = "failure" ]; then
            echo "下载CI构建的KSU失败!"
          fi
          # add_SUSFS 是 continue-on-error，失败了构建也会继续，产物会静默缺少 SUSFS 模块；
          # 上游 zzh20188 为这一步单独留了提示，本仓库原先漏了，导致「SUSFS 模块没下到」
          # 只能靠产物里少一个目录发现。这里补上，且与 KSU 的提示分开写，便于定位。
          if [ "$SUSFS_OUTCOME" = "failure" ]; then
            echo "下载CI构建的SUSFS模块失败!（构建继续，但产物中不含 SUSFS 模块，请检查上面的 add SUSFS 步骤日志）"
          fi

      # 按 APK 路径/文件名是否含 spoofed 分流，
      # 让普通管理器与 Spoofed（伪装官方包名）管理器成为两个独立产物，
      # 而不是混在一个压缩包里。
      - name: 分流管理器 APK
        if: steps.add_KSU.outcome == 'success'
        run: |
          rm -rf manager-out manager-out-spoofed
          mkdir -p manager-out manager-out-spoofed
          find manager-artifacts -type f -name "*.apk" | while IFS= read -r f; do
            case "$f" in
              *[Ss]poofed*) cp -f "$f" "manager-out-spoofed/$(basename "$f")" ;;
              *) cp -f "$f" "manager-out/$(basename "$f")" ;;
            esac
          done
          echo "--- 普通管理器 ---"
          ls -1 manager-out || true
          echo "--- Spoofed 管理器 ---"
          ls -1 manager-out-spoofed || true

          # 每个变体预期只应有 1 个 APK；多出来说明上游又新增了同名的中间产物，
          # 这类 APK 通常是未正式签名的，不能混进刷机包。
          for d in manager-out manager-out-spoofed; do
            cnt=$(find "$d" -type f -name "*.apk" | wc -l)
            if [ "$cnt" -gt 1 ]; then
              echo "::warning::$d 中发现 $cnt 个 APK（预期 1 个），请检查上游 Manager 产物是否新增了中间产物："
              find "$d" -type f -name "*.apk" -printf "  %p\n"
            fi
          done

      # [防线] 校验实际下载到的 APK 版本与"按提交数算出的预期版本"是否一致。
      # 版本挑错时（例如算出的目标版本偏高、回退到旧 APK）产物名写的仍是目标值，
      # 历史上出现过"产物名 40922、实际 APK 是 40879"的错配，刷入后提示版本不匹配。
      #
      # 严格度默认只告警：APK 版本号的口径（aapt 的 versionCode vs versionName）
      # 未在真实产物上验证过，直接 fail-closed 有把所有构建打挂的风险。
      # 确认口径后，在仓库 Settings → Variables 里设 MANAGER_VERSION_STRICT=true
      # 即可升级为硬失败。
      - name: 校验管理器 APK 版本
        if: steps.add_KSU.outcome == 'success'
        env:
          EXPECTED: "${{ env.MANAGER_VERSION || env.KSU_VERSION }}"
          STRICT: "${{ vars.MANAGER_VERSION_STRICT || 'false' }}"
        run: |
          if [ -z "$EXPECTED" ]; then
            echo "::warning::无预期版本号，跳过管理器版本校验"
            exit 0
          fi
          echo "预期管理器版本: $EXPECTED（严格模式=$STRICT）"
          status=0
          for f in manager-out/*.apk manager-out-spoofed/*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            actual=""

            # 优先用 aapt（若 runner 上有 Android SDK build-tools）
            if command -v aapt >/dev/null 2>&1; then
              actual=$(aapt dump badging "$f" 2>/dev/null \
                | sed -n "s/.*versionCode='\([0-9]\{1,\}\)'.*/\1/p" | head -n 1)
            fi
            # 回退：从文件名取第一段 >=4 位的数字
            if [ -z "$actual" ]; then
              actual=$(printf '%s' "$base" | grep -oE '[0-9]{4,}' | head -n 1)
            fi

            if [ -z "$actual" ]; then
              echo "::warning::$base 无法解析版本号（aapt 不可用且文件名不含版本号），跳过该包"
              continue
            fi

            if [ "$actual" = "$EXPECTED" ]; then
              echo "✓ $base 版本一致（$actual）"
            elif [ "$STRICT" = "true" ]; then
              echo "::error::$base 管理器版本不一致：实际=$actual 预期=$EXPECTED"
              status=1
            else
              echo "::warning::$base 管理器版本不一致：实际=$actual 预期=$EXPECTED（未开启严格模式，继续上传）"
            fi
          done
          exit $status

      - name: 上传管理器 APK
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager(${{ env.MANAGER_VERSION || env.KSU_VERSION }})
          path: manager-out/*.apk
          if-no-files-found: warn

      - name: 上传 Spoofed 管理器 APK
        if: steps.add_KSU.outcome == 'success' && inputs.manager_spoofed
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.kernelsu_variant }}-Spoofed-Manager(${{ env.MANAGER_VERSION || env.KSU_VERSION }})
          path: manager-out-spoofed/*.apk
          if-no-files-found: warn

      - name: 上传SUSFS模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
